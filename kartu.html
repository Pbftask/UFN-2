<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>Arcana · Koleksi</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <!-- Firebase SDK modular -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== DARK THEME ===== */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0b0e14;
      color: #e8edf5;
      min-height: 100vh;
      padding: 1rem 1rem 88px;
      transition: background 0.3s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    body.dark {
      background: #0b0e14;
      color: #e8edf5;
    }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.5);
    }
    .glass-light {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 32px;
      box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.5);
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 -6px 28px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.5rem 0.6rem 0.75rem;
      z-index: 1000;
      border-radius: 32px 32px 0 0;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      font-size: 0.65rem;
      font-weight: 500;
      color: #6b7a8f;
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      transition: 0.2s;
      cursor: pointer;
      gap: 2px;
      min-width: 52px;
      letter-spacing: 0.3px;
    }
    .bottom-nav .nav-item i {
      font-size: 1.3rem;
      margin-bottom: 1px;
      transition: 0.2s;
    }
    .bottom-nav .nav-item.active {
      color: #7aa2f7;
      background: rgba(122, 162, 247, 0.08);
    }
    .bottom-nav .nav-item.active i {
      transform: scale(1.06);
    }
    .bottom-nav .nav-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Auth */
    .auth-card {
      max-width: 400px;
      margin: 2rem auto;
      padding: 2.4rem 2rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 56px -12px rgba(0, 0, 0, 0.6);
    }
    .auth-card h2 {
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      margin-bottom: 1.6rem;
      color: #e8edf5;
    }
    .auth-card h2 i {
      margin-right: 8px;
      color: #7aa2f7;
    }
    .auth-input {
      width: 100%;
      padding: 0.9rem 1.4rem;
      margin: 0.4rem 0 1rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: #e8edf5;
      transition: 0.2s;
    }
    .auth-input::placeholder {
      color: #6b7a8f;
    }
    .auth-input:focus {
      outline: none;
      border-color: #7aa2f7;
      box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.08);
    }
    .btn-primary {
      background: #1d2b4b;
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }
    .btn-primary:hover {
      background: #2b3a67;
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #7aa2f7;
      color: #7aa2f7;
      padding: 0.6rem 1.4rem;
      border-radius: 60px;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
    }
    .btn-outline:hover {
      background: rgba(122, 162, 247, 0.08);
    }
    .btn-danger {
      background: #c62828;
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      font-size: 0.95rem;
    }
    .btn-danger:hover {
      background: #b71c1c;
      transform: scale(0.98);
    }
    .btn-danger:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Grid & Cards */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1.4rem;
      margin: 1.8rem 0;
    }
    .card-item {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 26px;
      padding: 0.7rem 0.7rem 0.9rem;
      text-align: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .card-item:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.45);
      border-color: rgba(122, 162, 247, 0.25);
    }
    .card-item:active {
      transform: translateY(-1px) scale(0.99);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 18px;
      background: #1a1f2a;
      transition: 0.2s;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }
    .card-name {
      font-weight: 600;
      margin: 0.6rem 0 0.2rem;
      font-size: 0.95rem;
      letter-spacing: -0.2px;
      color: #e8edf5;
    }
    .badge-rarity {
      display: inline-block;
      padding: 0.15rem 1rem;
      border-radius: 60px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin: 0.15rem 0;
      text-transform: uppercase;
    }
    .rarity-Common {
      background: #2e7d32;
      color: white;
    }
    .rarity-Uncommon {
      background: #43a047;
      color: white;
    }
    .rarity-Rare {
      background: #1e88e5;
      color: white;
    }
    .rarity-Epic {
      background: #8e24aa;
      color: white;
    }
    .rarity-Legend {
      background: #f9a825;
      color: #1f1f1f;
    }
    .rarity-Mythic {
      background: #00bcd4;
      color: white;
      box-shadow: 0 0 16px #00bcd4aa;
      animation: mythicGlow 2s infinite alternate;
    }
    @keyframes mythicGlow {
      0% {
        box-shadow: 0 0 8px #00bcd4aa;
      }
      100% {
        box-shadow: 0 0 24px #00e5ff;
      }
    }
    .rarity-Special {
      background: linear-gradient(145deg, #ffd700, #ffb300);
      color: #1f1f1f;
      box-shadow: 0 0 20px #ffd700aa;
      animation: specialGlow 2.4s infinite alternate;
    }
    @keyframes specialGlow {
      0% {
        box-shadow: 0 0 12px #ffd70088;
      }
      100% {
        box-shadow: 0 0 36px #ffb300;
      }
    }
    .label-badge {
      background: #37474f;
      color: white;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-left: 0.2rem;
      text-transform: uppercase;
    }
    .label-EVENT {
      background: #d32f2f;
    }
    .label-SHOP {
      background: #2e7d32;
    }
    .owned-badge {
      background: #1d2b4b;
      color: white;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .not-owned {
      opacity: 0.5;
      filter: grayscale(0.7);
    }

    .flex {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .text-muted {
      color: #6b7a8f;
      font-size: 0.85rem;
    }

    /* ===== PREMIUM MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
      animation: overlayFade 0.35s ease;
    }
    @keyframes overlayFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .modal-content {
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(165deg, rgba(18, 22, 35, 0.96), rgba(10, 13, 22, 0.98));
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 48px;
      padding: 2rem 2rem 1.6rem;
      animation: modalSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      transform: translateY(0);
    }
    @keyframes modalSlideUp {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .modal-content::-webkit-scrollbar {
      width: 4px;
    }
    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-content::-webkit-scrollbar-thumb {
      background: rgba(122, 162, 247, 0.3);
      border-radius: 10px;
    }

    /* Glow effect on modal */
    .modal-content::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(122, 162, 247, 0.1), transparent, rgba(122, 162, 247, 0.05));
      z-index: -1;
      pointer-events: none;
    }

    .modal-close-x {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #a9c1f7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
    }
    .modal-close-x:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: rotate(90deg) scale(1.1);
    }
    .modal-close-x:active {
      transform: rotate(90deg) scale(0.9);
    }

    .modal-card-img {
      width: 100%;
      max-width: 240px;
      border-radius: 28px;
      display: block;
      margin: 0.2rem auto 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: transform 0.3s ease;
    }
    .modal-card-img:hover {
      transform: scale(1.02);
    }

    .modal-title {
      font-weight: 700;
      margin-top: 1rem;
      text-align: center;
      letter-spacing: -0.4px;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #e8edf5, #a9c1f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal-badges {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin: 0.6rem 0 0.4rem;
      flex-wrap: wrap;
    }

    .modal-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 0.6rem;
      margin: 1rem 0 0.8rem;
    }
    .modal-stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 0.7rem 0.4rem;
      text-align: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .modal-stat-pill:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(122, 162, 247, 0.2);
    }
    .modal-stat-pill .stat-icon {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 0.15rem;
    }
    .modal-stat-pill .stat-val {
      font-weight: 700;
      font-size: 1.1rem;
      color: #e8edf5;
    }
    .modal-stat-pill .stat-lbl {
      font-size: 0.6rem;
      color: #8a9aaf;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-desc {
      text-align: center;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #b8c7dd;
      padding: 0.4rem 0.2rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      margin: 0.4rem 0;
    }

    .modal-footer {
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .modal-footer .modal-actions {
      display: flex;
      gap: 0.8rem;
    }
    .modal-footer .modal-actions .btn-primary {
      flex: 1;
      padding: 0.7rem;
      font-size: 0.9rem;
    }

    .modal-owner-info {
      text-align: center;
      font-size: 0.78rem;
      color: #6b7a8f;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .modal-owner-info span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .modal-owner-info i {
      color: #7aa2f7;
    }

    /* Pulsing rarity glow on modal */
    .modal-rarity-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(122, 162, 247, 0.03), transparent 70%);
      pointer-events: none;
      z-index: -1;
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d2b4b;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      z-index: 9999;
      animation: toastIn 0.35s ease;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    @keyframes toastIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      flex-direction: column;
      gap: 1rem;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #7aa2f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loading-text {
      color: #e8edf5;
      font-weight: 500;
      font-size: 1rem;
    }

    @media (max-width: 640px) {
      .grid-cards {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }
      .auth-card {
        padding: 1.8rem 1.4rem;
      }
      .modal-content {
        padding: 1.6rem 1.4rem 1.2rem;
        border-radius: 32px;
      }
      .modal-title {
        font-size: 1.3rem;
      }
      .modal-card-img {
        max-width: 180px;
      }
      .modal-stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 0.4rem;
      }
      .modal-footer .modal-actions {
        flex-direction: column;
      }
    }
    @media (min-width: 1024px) {
      .grid-cards {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      }
    }
    .fw-600 {
      font-weight: 600;
    }

    /* ===== IMAGE PROTECTION ===== */
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      pointer-events: auto;
    }

    /* ===== FEATURE LOCK (Main) ===== */
    .nav-item.locked {
      opacity: 0.35;
    }
    .nav-item.locked .fa-lock-badge {
      position: absolute;
      font-size: 0.55rem;
      transform: translate(10px, -8px);
      color: #e57373;
    }
    .feature-closed {
      text-align: center;
      padding: 3rem 1.4rem;
    }
    .feature-closed i.fa-lock {
      font-size: 2.6rem;
      color: #6b7a8f;
      margin-bottom: 1rem;
    }
    .feature-closed h3 {
      font-weight: 600;
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      color: #e8edf5;
    }

    /* Toggle Switch */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.2rem;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      transition: 0.25s;
    }
    .switch-slider::before {
      content: '';
      position: absolute;
      height: 24px;
      width: 24px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.25s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .switch input:checked + .switch-slider {
      background: #43a047;
    }
    .switch input:checked + .switch-slider::before {
      transform: translateX(22px);
    }

    /* Top App Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.2rem 0.2rem 1.2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.4px;
    }
    .topbar-brand i {
      color: #7aa2f7;
    }
    .topbar-balance {
      display: flex;
      gap: 0.5rem;
    }
    .balance-chip {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.35rem 0.8rem;
      border-radius: 40px;

<body>
  <div id="app" class="app"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav" style="display: none;">
    <button class="nav-item" data-view="dashboard"><i class="fas fa-compass"></i><span>Beranda</span></button>
    <button class="nav-item" data-view="collection"><i class="fas fa-layer-group"></i><span>Koleksi</span></button>
    <button class="nav-item" data-view="shop"><i class="fas fa-store-alt"></i><span>Shop</span></button>
    <button class="nav-item" data-view="event"><i class="fas fa-bolt"></i><span>Event</span></button>
    <button class="nav-item" data-view="play" id="playNavBtn" style="position:relative;"><i class="fas fa-gamepad"></i><span>Main</span></button>
    <button class="nav-item" data-view="profile"><i class="fas fa-circle-user"></i><span>Profil</span></button>
  </nav>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Memproses...</div>
  </div>

  <script type="module">
    // ============================================================
    // 1. Firebase Init
    // ============================================================
    import { initializeApp } from "firebase/app";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "firebase/auth";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      getDocs,
      query,
      deleteDoc,
      increment,
      addDoc,
      serverTimestamp,
      onSnapshot,
      runTransaction,
      deleteField
    } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyA4HuTmEgiowYaBH3doN2INZD5chk9NG-U",
      authDomain: "puki-678bf.firebaseapp.com",
      databaseURL: "https://puki-678bf-default-rtdb.firebaseio.com",
      projectId: "puki-678bf",
      storageBucket: "puki-678bf.firebasestorage.app",
      messagingSenderId: "343647284151",
      appId: "1:343647284151:web:c26e7f5f75235c187a1632"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    // ============================================================
    // 2. State
    // ============================================================
    let currentUser = null;
    let currentUserData = null;
    let allCards = [];
    let userCards = {};
    let userCardIds = new Set();
    let isAdmin = false;
    let currentView = 'dashboard';
    let unsubscribeCards = null;
    let userDataLoaded = false;
    let cardsLoaded = false;

    // Main Bareng (Play) state
    let currentRoomId = null;
    let currentRoomData = null;
    let unsubscribeRoom = null;

    // Pengaturan global (dikontrol admin), misal buka/tutup fitur Main
    let appSettings = { playEnabled: true };
    let unsubscribeSettings = null;

    const appEl = document.getElementById('app');
    const bottomNav = document.getElementById('bottomNav');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // ============================================================
    // Proteksi Gambar — cegah simpan/seret gambar sembarangan
    // ============================================================
    document.addEventListener('contextmenu', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
    document.addEventListener('dragstart', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    // ============================================================
    // 3. Loading Helpers
    // ============================================================
    function showLoading(message = 'Memproses...') {
      loadingText.textContent = message;
      loadingOverlay.style.display = 'flex';
    }

    function hideLoading() {
      loadingOverlay.style.display = 'none';
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    function rarityClass(r) {
      return 'rarity-' + r;
    }

    // ============================================================
    // 4. Render Card (name, image, rarity, label)
    // ============================================================
    function renderCard(card, ownedCount = 0) {
      const owned = ownedCount > 0;
      const el = document.createElement('div');
      el.className = 'card-item' + (owned ? '' : ' not-owned');
      const hasStats = card.attack || card.defense || card.hp;
      el.innerHTML = `
        <img class="card-img" src="${card.image}" alt="${card.name}" loading="lazy" draggable="false" oncontextmenu="return false"
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%231a1f2a%22 width=%22200%22 height=%22300%22/%3E%3Ctext x=%2250%22 y=%22150%22 font-family=%22sans%22 fill=%22%236b7a8f%22%3ENo img%3C/text%3E%3C/svg%3E'">
        <div class="card-name">${card.name}</div>
        <div>
          <span class="badge-rarity ${rarityClass(card.rarity)}">${card.rarity}</span>
          ${card.label ? `<span class="label-badge label-${card.label}">${card.label}</span>` : ''}
        </div>
        ${hasStats ? `<div class="text-muted" style="font-size:0.65rem;margin-top:0.3rem;">
          ${card.attack ? `<i class="fas fa-khanda" style="color:#e57373;"></i> ${card.attack}` : ''}
          ${card.defense ? ` &nbsp; <i class="fas fa-shield-halved" style="color:#64b5f6;"></i> ${card.defense}` : ''}
          ${card.hp ? ` &nbsp; <i class="fas fa-heart" style="color:#f06292;"></i> ${card.hp}` : ''}
        </div>` : ''}
        ${owned ? `<span class="owned-badge">×${ownedCount}</span>` : '<span class="owned-badge" style="background:#37474f;">0</span>'}
      `;
      el.addEventListener('click', () => showCardDetail(card, ownedCount));
      return el;
    }

    // ============================================================
    // 5. Views & Navigation
    // ============================================================
    function showView(name) {
      currentView = name;
      updateNav();
      renderApp();
    }

    function updateNav() {
      const items = bottomNav.querySelectorAll('.nav-item');
      items.forEach(b => {
        b.classList.toggle('active', b.dataset.view === currentView);
      });
    }

    // ============================================================
    // 6. Main Render
    // ============================================================
    async function renderApp() {
      if (!currentUser) {
        renderAuth();
        bottomNav.style.display = 'none';
        return;
      }
      bottomNav.style.display = 'flex';

      if (!userDataLoaded) {
        showLoading('Memuat data user...');
        await loadUserData();
        userDataLoaded = true;
        hideLoading();
      }
      if (!cardsLoaded) {
        showLoading('Memuat data kartu...');
        await loadCards();
        cardsLoaded = true;
        hideLoading();
      }

      if (currentView === 'admin' && !isAdmin) {
        toast('Akses admin ditolak');
        currentView = 'dashboard';
      }

      updateNavWithAdmin();

      appEl.innerHTML = `
        <div class="topbar">
          <div class="topbar-brand"><i class="fas fa-dice-d6"></i> Arcana</div>
          <div class="topbar-balance">
            <span class="balance-chip"><i class="fas fa-coins"></i>${currentUserData?.coin ?? 0}</span>
            <span class="balance-chip"><i class="fas fa-gem"></i>${currentUserData?.diamond ?? 0}</span>
          </div>
        </div>
      `;

      const container = document.createElement('div');
      container.id = 'viewContainer';
      appEl.appendChild(container);

      switch (currentView) {
        case 'dashboard':
          renderDashboard(container);
          break;
        case 'collection':
          renderCollection(container);
          break;
        case 'shop':
          renderShop(container);
          break;
        case 'event':
          renderEvent(container);
          break;
        case 'play':
          if (!appSettings.playEnabled && !isAdmin) renderPlayClosed(container);
          else renderPlay(container);
          break;
        case 'profile':
          renderProfile(container);
          break;
        case 'admin':
          if (isAdmin) renderAdmin(container);
          else container.innerHTML = '<p class="text-muted">Akses ditolak</p>';
          break;
        default:
          container.innerHTML = '<p class="text-muted">Halaman tidak ditemukan</p>';
      }
    }

    // ============================================================
    // 7. Update Nav dengan Admin
    // ============================================================
    function updateNavWithAdmin() {
      const oldAdmin = bottomNav.querySelector('.nav-item[data-view="admin"]');
      if (oldAdmin) oldAdmin.remove();

      if (isAdmin) {
        const adminBtn = document.createElement('button');
        adminBtn.className = 'nav-item' + (currentView === 'admin' ? ' active' : '');
        adminBtn.dataset.view = 'admin';
        adminBtn.innerHTML = `<i class="fas fa-tools"></i><span>Admin</span>`;
        adminBtn.addEventListener('click', () => showView('admin'));
        bottomNav.appendChild(adminBtn);
      }
      updateNav();
      updatePlayNavLock();
    }

    // ============================================================
    // 8. Auth
    // ============================================================
    function renderAuth() {
      bottomNav.style.display = 'none';
      appEl.innerHTML = `
        <div class="auth-card">
          <h2><i class="fas fa-dice-d6"></i> Arcana</h2>
          <div id="authForm">
            <input class="auth-input" id="authEmail" placeholder="Email" type="email" />
            <input class="auth-input" id="authPass" placeholder="Password" type="password" />
            <div class="flex" style="justify-content:space-between; margin:0.8rem 0;">
              <button class="btn-primary" id="loginBtn" style="width:48%;"><i class="fas fa-sign-in-alt"></i> Login</button>
              <button class="btn-primary" id="registerBtn" style="width:48%; background:#2b3a67;"><i class="fas fa-user-plus"></i> Daftar</button>
            </div>
            <button class="btn-outline" id="resetBtn" style="width:100%;"><i class="fas fa-key"></i> Lupa Password</button>
          </div>
        </div>
      `;
      document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPass').value;
        showLoading('Login...');
        signInWithEmailAndPassword(auth, email, pass)
          .then(() => hideLoading())
          .catch(e => { hideLoading();
            toast(e.message); });
      });
      document.getElementById('registerBtn').addEventListener('click', () => {
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPass').value;
        showLoading('Membuat akun...');
        createUserWithEmailAndPassword(auth, email, pass)
          .then(async cred => {
            const defaultUsername = 'Player' + Math.floor(1000 + Math.random() * 9000);
            await setDoc(doc(db, 'users', cred.user.uid), {
              uid: cred.user.uid,
              email,
              username: defaultUsername,
              coin: 1000,
              diamond: 50,
              cardsOwned: {},
              createdAt: serverTimestamp(),
              isAdmin: false,
              lastDailyClaim: 0,
              missionsClaimed: {}
            });
            hideLoading();
            toast('Akun dibuat!');
          })
          .catch(e => { hideLoading();
            toast(e.message); });
      });
      document.getElementById('resetBtn').addEventListener('click', () => {
        const email = document.getElementById('authEmail').value;
        if (!email) return toast('Masukkan email');
        showLoading('Mengirim email reset...');
        sendPasswordResetEmail(auth, email)
          .then(() => { hideLoading();
            toast('Email reset terkirim'); })
          .catch(e => { hideLoading();
            toast(e.message); });
      });
    }

    // ============================================================
    // 9. Data Loaders
    // ============================================================
    async function loadUserData() {
      if (!currentUser) return;
      try {
        const snap = await getDoc(doc(db, 'users', currentUser.uid));
        if (snap.exists()) {
          currentUserData = snap.data();
          userCards = currentUserData.cardsOwned || {};
          userCardIds = new Set(Object.keys(userCards));
          isAdmin = currentUserData.isAdmin || false;
        }
      } catch (e) {
        console.warn('loadUserData error', e);
      }
    }

    function loadCards() {
      return new Promise((resolve) => {
        if (unsubscribeCards) unsubscribeCards();
        const q = query(collection(db, 'cards'));
        unsubscribeCards = onSnapshot(q, (snapshot) => {
          allCards = snapshot.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(c => c.enabled !== false);
          cardsLoaded = true;
          if (['dashboard', 'collection', 'shop', 'event'].includes(currentView)) {
            renderApp();
          }
          resolve();
        }, (error) => {
          console.warn('onSnapshot error, fallback getDocs', error);
          getDocs(query(collection(db, 'cards'))).then(snap => {
            allCards = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.enabled !== false);
            cardsLoaded = true;
            resolve();
          });
        });
      });
    }

    // ============================================================
    // 9b. Hadiah Harian & Misi
    // ============================================================
    const DAILY_COOLDOWN_MS = 24 * 60 * 60 * 1000;

    function getDailyStatus() {
      const last = currentUserData?.lastDailyClaim || 0;
      const diff = Date.now() - last;
      if (diff >= DAILY_COOLDOWN_MS) return { canClaim: true, msRemaining: 0 };
      return { canClaim: false, msRemaining: DAILY_COOLDOWN_MS - diff };
    }

    function formatDuration(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return `${h}j ${m}m ${s}d`;
    }

    async function claimDaily() {
      showLoading('Mengklaim hadiah harian...');
      let rewardCoin = 0, rewardDiamond = 0;
      try {
        await runTransaction(db, async (transaction) => {
          const userRef = doc(db, 'users', currentUser.uid);
          const snap = await transaction.get(userRef);
          if (!snap.exists()) throw new Error('User tidak ditemukan');
          const data = snap.data();
          const last = data.lastDailyClaim || 0;
          if (Date.now() - last < DAILY_COOLDOWN_MS) throw new Error('Belum waktunya klaim lagi');
          rewardCoin = Math.floor(Math.random() * (250 - 50 + 1)) + 50;
          rewardDiamond = Math.floor(Math.random() * (150 - 50 + 1)) + 50;
          transaction.update(userRef, {
            coin: increment(rewardCoin),
            diamond: increment(rewardDiamond),
            lastDailyClaim: Date.now()
          });
        });
        hideLoading();
        toast(`Hadiah harian: +${rewardCoin} coin, +${rewardDiamond} diamond!`);
        await loadUserData();
        renderApp();
      } catch (e) {
        hideLoading();
        toast(e.message);
      }
    }

    // Definisi misi — diamond sengaja lebih kecil jumlahnya dari coin karena diamond bernilai lebih mahal/langka
    const MISSIONS = [
      { id: 'collect_5', title: 'Kolektor Pemula', desc: 'Miliki 5 kartu berbeda', icon: 'fa-layer-group', reward: { coin: 200, diamond: 10 }, check: ctx => ctx.ownedCount >= 5 },
      { id: 'collect_15', title: 'Kolektor Ulung', desc: 'Miliki 15 kartu berbeda', icon: 'fa-layer-group', reward: { coin: 500, diamond: 25 }, check: ctx => ctx.ownedCount >= 15 },
      { id: 'collect_30', title: 'Master Koleksi', desc: 'Miliki 30 kartu berbeda', icon: 'fa-crown', reward: { coin: 1000, diamond: 50 }, check: ctx => ctx.ownedCount >= 30 },
      { id: 'own_rare', title: 'Pemburu Rare', desc: 'Miliki minimal 1 kartu Rare ke atas', icon: 'fa-gem', reward: { coin: 150, diamond: 8 }, check: ctx => ctx.ownedCards.some(c => ['Rare', 'Epic', 'Legend', 'Mythic', 'Special'].includes(c.rarity)) },
      { id: 'own_legend', title: 'Legenda Hidup', desc: 'Miliki kartu Legend ke atas', icon: 'fa-dragon', reward: { coin: 600, diamond: 30 }, check: ctx => ctx.ownedCards.some(c => ['Legend', 'Mythic', 'Special'].includes(c.rarity)) },
      { id: 'first_purchase', title: 'Pembeli Pertama', desc: 'Beli 1 kartu apa saja di Shop', icon: 'fa-shopping-cart', reward: { coin: 100, diamond: 5 }, check: ctx => !!ctx.userData.hasPurchased },
      { id: 'play_room', title: 'Main Bareng', desc: 'Buat atau gabung Room Main Bareng', icon: 'fa-gamepad', reward: { coin: 150, diamond: 8 }, check: ctx => !!ctx.userData.hasPlayedRoom }
    ];

    function getMissionContext(userData) {
      const owned = userData.cardsOwned || {};
      const ownedCards = allCards.filter(c => (owned[c.id] || 0) > 0);
      return { userData, ownedCount: Object.keys(owned).filter(id => owned[id] > 0).length, ownedCards };
    }

    function renderMissionsCard() {
      const ctx = getMissionContext(currentUserData || {});
      const claimed = currentUserData?.missionsClaimed || {};
      const rows = MISSIONS.map(m => {
        const done = m.check(ctx);
        const isClaimed = !!claimed[m.id];
        let btnHtml;
        if (isClaimed) btnHtml = `<span class="owned-badge"><i class="fas fa-check"></i> Diklaim</span>`;
        else if (done) btnHtml = `<button class="btn-primary mission-claim-btn" data-mission="${m.id}" style="width:auto;padding:0.5rem 1.1rem;font-size:0.8rem;"><i class="fas fa-gift"></i> Klaim</button>`;
        else btnHtml = `<span class="text-muted" style="font-size:0.75rem;white-space:nowrap;"><i class="fas fa-lock"></i> Belum selesai</span>`;
        return `
          <div class="flex" style="justify-content:space-between;align-items:center;padding:0.7rem 0;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:nowrap;">
            <div style="display:flex;align-items:center;gap:0.7rem;min-width:0;">
              <i class="fas ${m.icon}" style="font-size:1.2rem;color:${done && !isClaimed ? '#7aa2f7' : '#6b7a8f'};width:22px;text-align:center;flex-shrink:0;"></i>
              <div style="min-width:0;">
                <div class="fw-600" style="font-size:0.88rem;">${m.title}</div>
                <div class="text-muted" style="font-size:0.72rem;">${m.desc}</div>
                <div style="font-size:0.68rem;margin-top:0.15rem;color:#8a9aaf;"><i class="fas fa-coins" style="color:#f9a825;"></i> ${m.reward.coin} &nbsp; <i class="fas fa-gem" style="color:#00bcd4;"></i> ${m.reward.diamond}</div>
              </div>
            </div>
            <div style="flex-shrink:0;margin-left:0.6rem;">${btnHtml}</div>
          </div>
        `;
      }).join('');
      return `
        <div class="glass" style="padding:1.5rem 1.6rem;margin-bottom:1.4rem;">
          <h3 style="font-weight:600;font-size:1.05rem;margin-bottom:0.2rem;"><i class="fas fa-tasks" style="color:#7aa2f7;"></i> Misi &amp; Pencapaian</h3>
          <p class="text-muted" style="font-size:0.75rem;margin-bottom:0.4rem;">Diamond lebih berharga — jumlahnya sengaja lebih sedikit dari coin</p>
          ${rows}
        </div>
      `;
    }

    async function claimMission(missionId) {
      const mission = MISSIONS.find(m => m.id === missionId);
      if (!mission) return;
      showLoading('Mengklaim misi...');
      try {
        await runTransaction(db, async (transaction) => {
          const userRef = doc(db, 'users', currentUser.uid);
          const snap = await transaction.get(userRef);
          if (!snap.exists()) throw new Error('User tidak ditemukan');
          const data = snap.data();
          if (data.missionsClaimed && data.missionsClaimed[missionId]) throw new Error('Misi sudah diklaim');
          if (!mission.check(getMissionContext(data))) throw new Error('Misi belum selesai');
          transaction.update(userRef, {
            coin: increment(mission.reward.coin),
            diamond: increment(mission.reward.diamond),
            [`missionsClaimed.${missionId}`]: true
          });
        });
        hideLoading();
        toast(`Misi selesai! +${mission.reward.coin} coin, +${mission.reward.diamond} diamond`);
        await loadUserData();
        renderApp();
      } catch (e) {
        hideLoading();
        toast(e.message);
      }
    }

    // ============================================================
    function renderCollection(container) {
      const searchInput = document.createElement('input');
      searchInput.placeholder = 'Cari nama, rarity, label...';
      searchInput.className = 'auth-input';
      searchInput.style.marginBottom = '0.6rem';

      const filterRarity = document.createElement('select');
      filterRarity.className = 'auth-input';
      filterRarity.innerHTML =
        `<option value="">Semua Rarity</option>` +
        ['Common', 'Uncommon', 'Rare', 'Epic', 'Legend', 'Mythic', 'Special'].map(r => `<option value="${r}">${r}</option>`).join('');

      const filterLabel = document.createElement('select');
      filterLabel.className = 'auth-input';
      filterLabel.innerHTML = `<option value="">Semua Label</option><option value="SHOP">SHOP</option><option value="EVENT">EVENT</option>`;

      const sortSelect = document.createElement('select');
      sortSelect.className = 'auth-input';
      sortSelect.innerHTML =
        `<option value="newest">Terbaru</option><option value="oldest">Terlama</option><option value="name">Nama</option><option value="rarity">Rarity</option>`;

      const grid = document.createElement('div');
      grid.className = 'grid-cards';

      container.append(searchInput, filterRarity, filterLabel, sortSelect, grid);

      function filterCards() {
        const search = searchInput.value.toLowerCase();
        const rarity = filterRarity.value;
        const label = filterLabel.value;
        const sort = sortSelect.value;

        let list = allCards.filter(c => {
          if (rarity && c.rarity !== rarity) return false;
          if (label && c.label !== label) return false;
          if (search &&
            !c.name.toLowerCase().includes(search) &&
            !c.rarity?.toLowerCase().includes(search) &&
            !c.label?.toLowerCase().includes(search)) return false;
          return true;
        });

        if (sort === 'newest') list.sort((a, b) => ((b.releasedAt || b.createdAt || '') > (a.releasedAt || a.createdAt || '') ? 1 : -1));
        else if (sort === 'oldest') list.sort((a, b) => ((a.releasedAt || a.createdAt || '') > (b.releasedAt || b.createdAt || '') ? 1 : -1));
        else if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
        else if (sort === 'rarity') list.sort((a, b) => (a.rarity || '').localeCompare(b.rarity || ''));

        grid.innerHTML = list.map(c => renderCard(c, userCards[c.id] || 0).outerHTML).join('') ||
          '<p class="text-muted" style="padding:2rem;text-align:center;">Tidak ada kartu</p>';
      }

      [searchInput, filterRarity, filterLabel, sortSelect].forEach(el => el.addEventListener('input', filterCards));
      filterCards();
    }

    // ============================================================
    // 12. Shop (dengan pembelian 1 kali & loading)
    // ============================================================
    function renderShop(container) {
      const shopCards = allCards.filter(c => c.label === 'SHOP' && c.enabled !== false);
      container.innerHTML = `<h3 style="font-weight:600;font-size:1.2rem;letter-spacing:-0.3px;"><i class="fas fa-store-alt" style="color:#7aa2f7;"></i> Toko</h3><div id="shopGrid" class="grid-cards"></div>`;
      const gridEl = document.getElementById('shopGrid');

      shopCards.forEach(c => {
        const owned = userCards[c.id] || 0;
        const price = c.price || 0;
        const currency = c.currency || 'coin';
        const balance = currency === 'coin' ? (currentUserData?.coin || 0) : (currentUserData?.diamond || 0);
        const canBuy = balance >= price && owned === 0; // Hanya bisa dibeli jika belum punya

        const el = renderCard(c, owned);
        const buyBtn = document.createElement('button');
        buyBtn.className = 'btn-primary';
        buyBtn.style.marginTop = '0.5rem';
        buyBtn.style.fontSize = '0.8rem';
        buyBtn.style.padding = '0.6rem 0.8rem';

        if (owned > 0) {
          buyBtn.innerHTML = `<i class="fas fa-check"></i> Sudah dimiliki`;
          buyBtn.disabled = true;
          buyBtn.style.opacity = '0.4';
        } else {
          buyBtn.innerHTML = `<i class="fas fa-shopping-cart"></i> Beli ${price} ${currency}`;
          buyBtn.disabled = !canBuy || !c.enabled;
          if (!canBuy) buyBtn.style.opacity = '0.4';
        }

        buyBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (owned > 0) return toast('Kartu sudah dimiliki!');
          if (!canBuy) return toast('Saldo tidak cukup');
          if (!c.id) return;

          showLoading(`Membeli ${c.name}...`);
          try {
            // Gunakan transaction untuk keamanan
            await runTransaction(db, async (transaction) => {
              const userRef = doc(db, 'users', currentUser.uid);
              const userSnap = await transaction.get(userRef);
              if (!userSnap.exists()) throw new Error('User tidak ditemukan');

              const userData = userSnap.data();
              const currentBalance = currency === 'coin' ? (userData.coin || 0) : (userData.diamond || 0);

              if (currentBalance < price) throw new Error('Saldo tidak cukup');

              // Cek apakah sudah punya
              if (userData.cardsOwned && userData.cardsOwned[c.id] && userData.cardsOwned[c.id] > 0) {
                throw new Error('Kartu sudah dimiliki!');
              }

              // Update saldo
              const updateData = {};
              if (currency === 'coin') updateData.coin = increment(-price);
              else updateData.diamond = increment(-price);
              updateData[`cardsOwned.${c.id}`] = increment(1);
              updateData.hasPurchased = true;

              transaction.update(userRef, updateData);

              // Tambah transaksi
              const txRef = doc(collection(db, 'transactions'));
              transaction.set(txRef, {
                userId: currentUser.uid,
                cardId: c.id,
                currency,
                price,
                createdAt: serverTimestamp()
              });
            });

            hideLoading();
            toast(`Berhasil membeli ${c.name}!`);
            await loadUserData();
            renderApp();
          } catch (e) {
            hideLoading();
            toast('Gagal membeli: ' + e.message);
          }
        });
        el.appendChild(buyBtn);
        gridEl.appendChild(el);
      });
      if (!shopCards.length) gridEl.innerHTML = '<p class="text-muted" style="padding:2rem;text-align:center;">Tidak ada kartu di Shop</p>';
    }

    async function editCard(cardId) {
      let data = {
        name: '',
        image: '',
        description: '',
        attack: 0,
        defense: 0,
        hp: 0,
        element: '',
        rarity: 'Common',
        label: 'SHOP',
        currency: 'coin',
        price: 0,
        enabled: true,
        releasedAt: new Date().toISOString().slice(0, 10)
      };
      if (cardId) {
        const snap = await getDoc(doc(db, 'cards', cardId));
        if (snap.exists()) data = { ...snap.data(), id: cardId };
      }
      const form = document.createElement('div');
      form.className = 'glass';
      form.style.padding = '1.8rem';
      form.style.margin = '1rem 0';
      const fields = ['name', 'image', 'description', 'attack', 'defense', 'hp', 'element', 'releasedAt'];
      form.innerHTML = `
        <h4 style="font-weight:600;margin-bottom:1rem;">${cardId ? 'Edit' : 'Tambah'} Kartu</h4>
        ${fields.map(f => `<div class="input-group"><label>${f}</label><input id="f_${f}" value="${data[f] || ''}" ${f === 'releasedAt' ? 'type="date"' : ''}></div>`).join('')}
        <div class="input-group"><label>Rarity</label><select id="f_rarity">${['Common','Uncommon','Rare','Epic','Legend','Mythic','Special'].map(r => `<option ${data.rarity === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
        <div class="input-group"><label>Label</label><select id="f_label">${['SHOP','EVENT'].map(l => `<option ${data.label === l ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="input-group"><label>Currency</label><select id="f_currency">${['coin','diamond'].map(c => `<option ${data.currency === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="input-group"><label>Price</label><input id="f_price" type="number" value="${data.price || 0}"></div>
        <div class="input-group"><label>Enabled</label><select id="f_enabled"><option value="true" ${data.enabled !== false ? 'selected' : ''}>Aktif</option><option value="false" ${data.enabled === false ? 'selected' : ''}>Nonaktif</option></select></div>
        <button class="btn-primary" id="saveCardBtn" style="margin-top:0.8rem;"><i class="fas fa-save"></i> Simpan</button>
      `;
      document.getElementById('adminContent').prepend(form);
      document.getElementById('saveCardBtn').addEventListener('click', async () => {
        showLoading('Menyimpan kartu...');
        try {
          const payload = {
            name: document.getElementById('f_name').value,
            image: document.getElementById('f_image').value,
            description: document.getElementById('f_description').value,
            attack: Number(document.getElementById('f_attack').value),
            defense: Number(document.getElementById('f_defense').value),
            hp: Number(document.getElementById('f_hp').value),
            element: document.getElementById('f_element').value,
            rarity: document.getElementById('f_rarity').value,
            label: document.getElementById('f_label').value,
            currency: document.getElementById('f_currency').value,
            price: Number(document.getElementById('f_price').value),
            enabled: document.getElementById('f_enabled').value === 'true',
            releasedAt: document.getElementById('f_releasedAt').value || new Date().toISOString().slice(0, 10),
            createdAt: serverTimestamp()
          };
          if (cardId) await updateDoc(doc(db, 'cards', cardId), payload);
          else await addDoc(collection(db, 'cards'), payload);
          hideLoading();
          toast('Kartu disimpan!');
          renderAdminCards(document.getElementById('adminContent'));
        } catch (e) {
          hideLoading();
          toast('Gagal menyimpan: ' + e.message);
        }
      });
    }

        hideLoading();
        el.innerHTML =
          `<h4 style="font-weight:600;margin-bottom:1rem;"><i class="fas fa-users"></i> Kelola User</h4><div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">`;

          showLoading('Menambahkan coin...');
          await updateDoc(doc(db, 'users', uid), { coin: increment(val) });
          hideLoading();
          toast('Coin ditambahkan');
          renderAdminUsers(el);
        }));
        el.querySelectorAll('[data-action="addDiamond"]').forEach(b => b.addEventListener('click', async () => {
          const uid = b.dataset.uid;
          const val = Number(document.getElementById(`diamond_${uid}`).value);
          if (!val) return;
          showLoading('Menambahkan diamond...');
          await updateDoc(doc(db, 'users', uid), { diamond: increment(val) });

          toast('Diamond ditambahkan');

    // ============================================================
    // 15a. Pengaturan Global — Buka/Tutup Fitur Main (realtime)
    // ============================================================
    function subscribeSettings() {
      if (unsubscribeSettings) unsubscribeSettings();
      unsubscribeSettings = onSnapshot(doc(db, 'settings', 'config'), (snap) => {
        appSettings = snap.exists() ? { playEnabled: true, ...snap.data() } : { playEnabled: true };
        updatePlayNavLock();
        if (currentView === 'play') renderApp();
        if (currentView === 'admin') { /* biarkan admin re-klik tab pengaturan untuk refresh */ }
      }, (e) => console.warn('subscribeSettings error', e));
    }

    function updatePlayNavLock() {
      const btn = document.getElementById('playNavBtn');
      if (!btn) return;
      const closed = !appSettings.playEnabled && !isAdmin;
      btn.classList.toggle('locked', closed);
      let badge = btn.querySelector('.fa-lock-badge');
      if (closed && !badge) {
        badge = document.createElement('i');
        badge.className = 'fas fa-lock fa-lock-badge';
        btn.appendChild(badge);
      } else if (!closed && badge) {
        badge.remove();
      }
    }

    function renderPlayClosed(container) {
      container.innerHTML = `
        <div class="glass feature-closed">
          <i class="fas fa-lock"></i>
          <h3>Fitur Main Sedang Ditutup</h3>
          <p class="text-muted">Admin sedang menutup fitur Main Bareng untuk sementara. Silakan coba lagi nanti.</p>
        </div>
      `;
    }

    async function setPlayEnabled(enabled) {
      showLoading(enabled ? 'Membuka fitur Main...' : 'Menutup fitur Main...');
      try {
        await setDoc(doc(db, 'settings', 'config'), { playEnabled: enabled }, { merge: true });
        hideLoading();
        toast(enabled ? 'Fitur Main dibuka' : 'Fitur Main ditutup');
      } catch (e) {
        hideLoading();
        toast('Gagal mengubah pengaturan: ' + e.message);
      }
    }

    // ============================================================
    // 15b. Main Bareng (Play with Friends) — Room & Counter Kartu
    // ============================================================
    function genRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function subscribeRoom() {
      if (unsubscribeRoom) unsubscribeRoom();
      unsubscribeRoom = onSnapshot(doc(db, 'gameRooms', currentRoomId), (snap) => {
        if (!snap.exists()) {
          toast('Room telah ditutup');
          leaveRoomLocal();
          return;
        }
        currentRoomData = snap.data();
        if (currentView === 'play') renderApp();
      }, (e) => console.warn('subscribeRoom error', e));
    }

    function leaveRoomLocal() {
      if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
      currentRoomId = null;
      currentRoomData = null;
      if (currentView === 'play') renderApp();
    }

    async function createRoom() {
      showLoading('Membuat room...');
      try {
        const code = genRoomCode();
        await setDoc(doc(db, 'gameRooms', code), {
          code,
          hostUid: currentUser.uid,
          createdAt: serverTimestamp(),
          status: 'waiting',
          players: { [currentUser.uid]: { email: currentUser.email, username: currentUserData?.username || '' } },
          cards: {}
        });
        currentRoomId = code;
        currentRoomData = null;
        markPlayedRoom();
        hideLoading();
        toast('Room dibuat: ' + code);
        subscribeRoom();
        renderApp();
      } catch (e) {
        hideLoading();
        toast('Gagal membuat room: ' + e.message);
      }
    }

    function markPlayedRoom() {
      if (currentUserData?.hasPlayedRoom) return;
      if (currentUserData) currentUserData.hasPlayedRoom = true;
      updateDoc(doc(db, 'users', currentUser.uid), { hasPlayedRoom: true }).catch(() => {});
    }

    async function joinRoom(rawCode) {
      const code = (rawCode || '').trim().toUpperCase();
      if (!code) return toast('Masukkan kode room');
      showLoading('Bergabung ke room...');
      try {
        const roomRef = doc(db, 'gameRooms', code);
        const snap = await getDoc(roomRef);
        if (!snap.exists()) { hideLoading(); return toast('Room tidak ditemukan'); }
        const data = snap.data();
        const already = !!(data.players && data.players[currentUser.uid]);
        const playerCount = Object.keys(data.players || {}).length;
        if (!already && playerCount >= 2) { hideLoading(); return toast('Room sudah penuh (maks 2 pemain)'); }
        await updateDoc(roomRef, { [`players.${currentUser.uid}`]: { email: currentUser.email, username: currentUserData?.username || '' } });
        currentRoomId = code;
        currentRoomData = null;
        markPlayedRoom();
        hideLoading();
        subscribeRoom();
        renderApp();
      } catch (e) {
        hideLoading();
        toast('Gagal bergabung: ' + e.message);
      }
    }

    async function leaveRoom() {
      if (!currentRoomId) return;
      const roomId = currentRoomId;
      showLoading('Keluar dari room...');
      try {
        const roomRef = doc(db, 'gameRooms', roomId);
        const snap = await getDoc(roomRef);
        if (snap.exists()) {
          const data = snap.data();
          const remaining = Object.keys(data.players || {}).filter(u => u !== currentUser.uid);
          if (remaining.length === 0) {
            await deleteDoc(roomRef);
          } else {
            await updateDoc(roomRef, {
              [`players.${currentUser.uid}`]: deleteField(),
              [`cards.${currentUser.uid}`]: deleteField()
            });
          }
        }
      } catch (e) {
        console.warn('leaveRoom error', e);
      }
      hideLoading();
      leaveRoomLocal();
    }

    async function addCardToZone(card) {
      if (!currentRoomId) return;
      const owned = userCards[card.id] || 0;
      if (!owned) return toast('Kamu tidak memiliki kartu ini');
      const instanceId = 'c' + Date.now() + Math.floor(Math.random() * 1000);
      const roomRef = doc(db, 'gameRooms', currentRoomId);
      try {
        await updateDoc(roomRef, {
          [`cards.${currentUser.uid}.${instanceId}`]: {
            cardId: card.id,
            name: card.name,
            image: card.image || '',
            rarity: card.rarity || '',
            hp: card.hp || 0,
            counter: card.hp || 0
          }
        });
      } catch (e) {
        toast('Gagal menambah kartu: ' + e.message);
      }
    }

    async function removeCardFromZone(instanceId) {
      if (!currentRoomId) return;
      const roomRef = doc(db, 'gameRooms', currentRoomId);
      try {
        await updateDoc(roomRef, { [`cards.${currentUser.uid}.${instanceId}`]: deleteField() });
      } catch (e) {
        toast('Gagal menghapus kartu: ' + e.message);
      }
    }

    async function changeCounter(uid, instanceId, delta) {
      if (!currentRoomId || uid !== currentUser.uid) return; // hanya boleh ubah kartu milik sendiri
      const current = currentRoomData?.cards?.[uid]?.[instanceId]?.counter || 0;
      const next = Math.max(0, current + delta);
      const roomRef = doc(db, 'gameRooms', currentRoomId);
      try {
        await updateDoc(roomRef, { [`cards.${uid}.${instanceId}.counter`]: next });
      } catch (e) {
        toast('Gagal ubah counter: ' + e.message);
      }
    }

    function renderPlay(container) {
      if (!currentRoomId) {
        container.innerHTML = `
          <h3 style="font-weight:600;font-size:1.2rem;letter-spacing:-0.3px;"><i class="fas fa-gamepad" style="color:#7aa2f7;"></i> Main Bareng Teman</h3>
          <p class="text-muted" style="margin:0.5rem 0 1.2rem;line-height:1.5;">Buat room lalu bagikan kodenya ke teman, atau gabung pakai kode yang kamu terima. Setiap kartu yang dibawa ke meja punya counter sendiri untuk dipakai saat bertarung.</p>
          <div class="glass" style="padding:1.6rem;">
            <button class="btn-primary" id="createRoomBtn"><i class="fas fa-plus"></i> Buat Room Baru</button>
            <div class="flex" style="margin-top:1.2rem;flex-wrap:nowrap;">
              <input class="auth-input" id="joinRoomInput" placeholder="Kode Room" maxlength="6" style="flex:1;text-transform:uppercase;margin:0;">
              <button class="btn-outline" id="joinRoomBtn">Gabung</button>
            </div>
          </div>
        `;
        document.getElementById('createRoomBtn').addEventListener('click', createRoom);
        document.getElementById('joinRoomBtn').addEventListener('click', () => joinRoom(document.getElementById('joinRoomInput').value));
        return;
      }

      if (!currentRoomData) {
        container.innerHTML = '<p class="text-muted" style="padding:2.5rem;text-align:center;"><i class="fas fa-spinner fa-spin"></i> Memuat room...</p>';
        return;
      }

      const players = currentRoomData.players || {};
      const cardsMap = currentRoomData.cards || {};
      const myUid = currentUser.uid;
      const otherUid = Object.keys(players).find(u => u !== myUid);

      const renderZone = (uid, isMe) => {
        const zoneCards = cardsMap[uid] || {};
        const entries = Object.entries(zoneCards);
        return `
          <div class="player-zone ${isMe ? 'me' : ''}">
            <div class="player-zone-header">
              <span><i class="fas fa-user${isMe ? '' : '-friends'}"></i> ${isMe ? 'Kamu' : (players[uid]?.username || players[uid]?.email || 'Lawan')}</span>
              <span class="text-muted" style="font-weight:400;font-size:0.75rem;">${entries.length} kartu</span>
            </div>
            <div class="zone-grid">
              ${entries.length ? entries.map(([iid, c]) => `
                <div class="play-card">
                  ${isMe ? `<button class="remove-play-card" data-remove="${iid}" title="Buang dari meja"><i class="fas fa-times"></i></button>` : ''}
                  <img src="${c.image}" alt="${c.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%231a1f2a%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E'">
                  <div class="play-card-name">${c.name}</div>
                  <div class="counter-row">
                    <button class="counter-btn" data-dec="${iid}" data-uid="${uid}" ${isMe ? '' : 'disabled style="opacity:.3;cursor:not-allowed;"'}>−</button>
                    <span class="counter-val">${c.counter ?? 0}</span>
                    <button class="counter-btn" data-inc="${iid}" data-uid="${uid}" ${isMe ? '' : 'disabled style="opacity:.3;cursor:not-allowed;"'}>+</button>
                  </div>
                </div>
              `).join('') : `<p class="text-muted" style="grid-column:1/-1;font-size:0.8rem;padding:0.6rem 0;">Belum ada kartu di meja</p>`}
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <h3 style="font-weight:600;font-size:1.2rem;letter-spacing:-0.3px;"><i class="fas fa-gamepad" style="color:#7aa2f7;"></i> Main Bareng</h3>
        <div class="room-code-box">
          <span>${currentRoomId}</span>
          <button id="copyRoomCode" title="Salin kode"><i class="fas fa-copy"></i></button>
        </div>
        <p class="text-muted" style="text-align:center;font-size:0.8rem;">
          ${otherUid ? `<i class="fas fa-circle" style="color:#43a047;font-size:0.5rem;"></i> ${players[otherUid]?.username || players[otherUid]?.email || 'Lawan'} sudah bergabung` : '<i class="fas fa-hourglass-half"></i> Menunggu teman bergabung, bagikan kode di atas'}
        </p>
        ${renderZone(myUid, true)}
        ${otherUid ? renderZone(otherUid, false) : ''}
        <button class="btn-outline" id="pickCardBtn" style="width:100%;margin:0.8rem 0;"><i class="fas fa-hand-sparkles"></i> Pilih Kartu dari Koleksi</button>
        <button class="btn-danger" id="leaveRoomBtn"><i class="fas fa-door-open"></i> Keluar Room</button>
      `;

      container.querySelector('#copyRoomCode').addEventListener('click', () => {
        navigator.clipboard?.writeText(currentRoomId);
        toast('Kode room disalin');
      });
      container.querySelector('#leaveRoomBtn').addEventListener('click', () => {
        if (confirm('Keluar dari room ini?')) leaveRoom();
      });
      container.querySelector('#pickCardBtn').addEventListener('click', () => showCardPicker());
      container.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => changeCounter(b.dataset.uid, b.dataset.inc, 1)));
      container.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => changeCounter(b.dataset.uid, b.dataset.dec, -1)));
      container.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => removeCardFromZone(b.dataset.remove)));
    }

    function showCardPicker() {
      const ownedIds = Object.keys(userCards).filter(id => userCards[id] > 0);
      const cardsOwned = allCards.filter(c => ownedIds.includes(c.id));
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content">
          <button class="modal-close-x" id="closePicker" aria-label="Tutup"><i class="fas fa-times"></i></button>
          <div class="modal-rarity-glow"></div>
          <h2 style="font-weight:700;text-align:center;margin-top:0.5rem;color:#e8edf5;"><i class="fas fa-layer-group" style="color:#7aa2f7;"></i> Pilih Kartu</h2>
          <p class="text-muted" style="text-align:center;font-size:0.85rem;margin:0.3rem 0 1.1rem;">Ketuk kartu untuk membawanya ke meja</p>
          <div class="grid-cards" id="pickerGrid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));"></div>
        </div>
      `;
      document.body.appendChild(overlay);
      const grid = overlay.querySelector('#pickerGrid');
      if (!cardsOwned.length) {
        grid.innerHTML = '<p class="text-muted" style="grid-column:1/-1;text-align:center;padding:1.5rem;">Kamu belum memiliki kartu apapun</p>';
      } else {
        cardsOwned.forEach(c => {
          const el = renderCard(c, userCards[c.id]);
          el.classList.add('picker-card');
          const clean = el.cloneNode(true); // cloneNode drops the old click listener
          clean.addEventListener('click', async () => {
            await addCardToZone(c);
            toast(`${c.name} dibawa ke meja`);
            overlay.remove();
          });
          grid.appendChild(clean);
        });
      }
      const close = () => overlay.remove();
      overlay.querySelector('#closePicker').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    }

              <div class="stat-lbl">Attack</div>

              <i class="fas fa-shield-halved stat-icon" style="color:#64b5f6;"></i>
              <div class="stat-val">${card.defense || 0}</div>
              <div class="stat-lbl">Defense</div>

              <div class="stat-val">${card.hp || 0}</div>
              <div class="stat-lbl">HP</div>
            </div>
          </div>` : ''}
          
          ${card.description ? `<div class="modal-desc"><i class="fas fa-quote-left" style="color:#7aa2f7;opacity:0.3;font-size:0.7rem;margin-right:0.2rem;"></i>${card.description}<i class="fas fa-quote-right" style="color:#7aa2f7;opacity:0.3;font-size:0.7rem;margin-left:0.2rem;"></i></div>` : ''}

        overlay.style.animation = 'modalSlideOut 0.25s ease forwards';
        setTimeout(() => overlay.remove(), 300);
      };
      
      // Add slide out animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes modalSlideOut {
          0% { opacity: 1; transform: translateY(0) scale(1); }
          100% { opacity: 0; transform: translateY(20px) scale(0.96); }
        }
      `;
      document.head.appendChild(style);
      
      overlay.querySelector('#closeModal').addEventListener('click', close);
      overlay.querySelector('#closeModalX').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      document.addEventListener('keydown', function escHandler(e) {
        if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); }
      });
    }

    // ============================================================
    // 17. Auth State Listener
    // ============================================================
    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        userDataLoaded = false;
        cardsLoaded = false;
        showLoading('Memuat data...');
        await loadUserData();
        userDataLoaded = true;
        if (!unsubscribeCards) {
          await loadCards();
        }
        if (!unsubscribeSettings) {
          subscribeSettings();
        }
        hideLoading();
        renderApp();
      } else {
        currentUser = null;
        currentUserData = null;
        userCards = {};
        userCardIds = new Set();
        isAdmin = false;
        userDataLoaded = false;
        cardsLoaded = false;
        if (unsubscribeCards) {
          unsubscribeCards();
          unsubscribeCards = null;
        }
        if (unsubscribeRoom) {
          unsubscribeRoom();
          unsubscribeRoom = null;
        }
        if (unsubscribeSettings) {
          unsubscribeSettings();
          unsubscribeSettings = null;
        }
        appSettings = { playEnabled: true };
        currentRoomId = null;
        currentRoomData = null;
        renderAuth();
      }
    });

    // ============================================================
    // 18. Nav Event Delegation
    // ============================================================
    document.querySelectorAll('.nav-item[data-view]').forEach(b => {
      b.addEventListener('click', () => showView(b.dataset.view));
    });
  </script>
</body>
</html>
