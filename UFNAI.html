<style>
:root{
  --accent: #b8905a;

}

html[data-theme="dark"]{
  --bg: #14181f;
  --surface: #1c212b;
  --surface-2: #232a36;
  --ink: #e9edf3;
  --ink-dim: #8f97a3;

html[data-theme="light"]{

  --ink-dim: #6a6f78;

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{

header.top{

.emblem{

.title-block{ display:flex; flex-direction:column; line-height:1.2; flex:1; min-width:0;}

}
.title-block .sub{
  font-size:11px; color:var(--ink-dim);
}

.top-actions{ display:flex; gap:6px; flex:none; }
.icon-btn{

.icon-btn:hover{ background:var(--surface-2); }

.avatar.ai{ color:var(--accent); }
.avatar.user{ color:var(--ink-dim); }

.msg-col{ display:flex; flex-direction:column; max-width:82%; }
.msg-row.user .msg-col{ align-items:flex-end; }

.bubble{

.bubble ul{ margin:6px 0 0; padding-left:18px; }
.bubble li{ margin-bottom:4px; }

/* ============================================================
   SKEMA FIRESTORE (sesuai Firestore.md)
   comments/   : { createdAt, likedBy, name, newsId, parentId, text }
   cauntries/  : { createdAt, description, name, weather: { temp, conditionKey, humidity, windSpeed, pressure, UV, visibility, aqi, rainChance, feelsLike, dewPoint, sunrise, sunset, updatedAt } }

/** Mendeteksi & menyimpan nama dari kalimat seperti "nama saya Budi" / "panggil aku Budi" */
function tryExtractName(rawText){
  const patterns = [
    /\bnama\s*(?:saya|aku|gue|gua)\s*(?:adalah|itu)?\s*([a-zA-Z' -]{2,30})/i,
    /\b(?:panggil|call)\s*(?:saya|aku|gue|gua|me)\s*([a-zA-Z' -]{2,30})/i,
    /\bsaya\s*(?:adalah|itu)\s*([a-zA-Z' -]{2,30})/i,
    /\bi'?m\s+([a-zA-Z' -]{2,30})/i,
    /\bmy name is\s+([a-zA-Z' -]{2,30})/i
  ];
  for(const re of patterns){
    const m = rawText.match(re);
    if(m && m[1]){
      const name = m[1].trim().replace(/\s+/g," ").split(" ").slice(0,2).join(" ");
      const cleaned = name.replace(/[.,!?]+$/,"");
      if(cleaned.length >= 2) return cleaned.replace(/\b\w/g, c => c.toUpperCase());
    }
  }
  return null;
}

const NOT_FOUND = "Maaf, data tersebut belum tersedia di database UFN.";
const FETCH_ERROR = "Maaf, terjadi kendala saat menghubungi database UFN. Coba lagi sebentar lagi.";

/* ============================================================
   MODUL: CUSTOM COMMANDS (Firestore: "ai_commands")
   ------------------------------------------------------------
   Fitur tambahan yang berjalan SEBELUM sistem AI utama.
   Tidak mengubah/menghapus fungsi, intent, atau logika lain
   yang sudah ada. Cukup lapisan pengecekan tambahan.

   Struktur dokumen di collection "ai_commands":
   {
     enabled: true,
     priority: 1,
     keywords: ["halo", "hai"],
     answer: "Halo juga!",
     contains: true,     // true = includes(), false = exact match
     ignoreCase: true     // true = abaikan huruf besar/kecil
   }
   ============================================================ */

/** Cache lokal berisi command yang sudah difilter (enabled) & diurutkan (priority ASC) */
let customCommandsCache = [];
let customCommandsUnsub = null;

/**
 * Mengaktifkan listener realtime ke collection "ai_commands".
 * Data di-cache di memori (customCommandsCache) agar hemat pembacaan Firestore.
 * Setiap ada perubahan (tambah/ubah/hapus command) di Firestore, cache
 * langsung diperbarui otomatis tanpa perlu refresh halaman.
 */
function initCustomCommandsListener(){
  if(!db) return;
  try{
    if(customCommandsUnsub) customCommandsUnsub(); // hindari listener ganda
    customCommandsUnsub = onSnapshot(
      collection(db, "ai_commands"),
      (snap) => {
        customCommandsCache = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(cmd => cmd.enabled === true)
          .sort((a, b) => (Number(a.priority) || 0) - (Number(b.priority) || 0));
        console.log(`✅ Custom commands dimuat: ${customCommandsCache.length} aktif`);
      },
      (err) => {
        console.error("❌ Gagal memuat ai_commands:", err);
      }
    );
  }catch(err){
    console.error("❌ Gagal inisialisasi listener ai_commands:", err);
  }
}

/**
 * Mencocokkan pesan pengguna dengan daftar custom command.
 * Mengembalikan field "answer" dari command pertama yang cocok
 * (sesuai urutan priority ASC), atau null jika tidak ada yang cocok.
 */
function matchCustomCommand(rawText){
  if(!customCommandsCache.length) return null;
  const message = String(rawText ?? "");

  for(const cmd of customCommandsCache){
    if(!Array.isArray(cmd.keywords) || typeof cmd.answer !== "string") continue;

    const ignoreCase = cmd.ignoreCase !== false;   // default true
    const useContains = cmd.contains !== false;    // default true
    const compareMessage = ignoreCase ? message.toLowerCase() : message;

    const isMatch = cmd.keywords.some(keyword => {
      if(typeof keyword !== "string") return false;
      const compareKeyword = ignoreCase ? keyword.toLowerCase() : keyword;
      return useContains
        ? compareMessage.includes(compareKeyword)
        : compareMessage === compareKeyword;
    });

    if(isMatch) return cmd.answer;
  }
  return null;
}

const cache = { countries:null, news:null, currencies:null, places:null, reactions:null, comments:null };

// ==== FUNGSI LOAD DATA ====

async function loadCountries(){
  if(cache.countries) return cache.countries;
  try{
    const snap = await getDocs(collection(db,"countries"));
    cache.countries = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    return cache.countries;
  }catch(e){
    console.error("Load countries error:", e);
    return [];
  }
}

async function loadNews(limitCount=20){
  if(cache.news) return cache.news;
  try{
    const q = query(collection(db,"news"), orderBy("createdAt","desc"), limit(limitCount));
    const snap = await getDocs(q);
    cache.news = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  }catch{
    try{
      const snap = await getDocs(collection(db,"news"));
      cache.news = snap.docs.map(d=>({ id:d.id, ...d.data() })).slice(0, limitCount);
    }catch(e){
      console.error("Load news error:", e);
      cache.news = [];
    }
  }
  return cache.news;
}

function norm(s){
  return (s||"").toString().toLowerCase().normalize("NFKD").replace(/[^\w\s]/g,"").trim();
}

function findCountryInText(text, countries){
  const t = norm(text);
  let best = null;
  for(const c of countries){
    const name = norm(c.name);
    if(name && t.includes(name)){
      if(!best || name.length > norm(best.name).length) best = c;
    }
  }
  return best;
}

function findAllCountriesInText(text, countries){
  const t = norm(text);
  return countries.filter(c => norm(c.name) && t.includes(norm(c.name)));
}

function findNewsInText(text, newsItems){
  const t = norm(text);
  let best = null;
  for(const n of newsItems){
    const title = norm(n.title);
    if(title && t.includes(title)){
      if(!best || title.length > norm(best.title).length) best = n;
    }
  }
  return best;
}

function fmtDate(ts){
  try{
    const d = ts?.toDate ? ts.toDate() : new Date(ts);
    if(isNaN(d)) return "-";
    return d.toLocaleDateString("id-ID",{ day:"numeric", month:"long", year:"numeric" });
  }catch{ return "-"; }
}

function fmtDateTime(ts){
  try{
    const d = ts?.toDate ? ts.toDate() : new Date(ts);
    if(isNaN(d)) return "-";
    return d.toLocaleString("id-ID",{ day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }catch{ return "-"; }
}

function fmtNumber(n){
  if(n===undefined||n===null||isNaN(n)) return "-";
  return Number(n).toLocaleString("id-ID");
}

function fmtCurrency(n){
  if(n===undefined||n===null||isNaN(n)) return "-";
  return new Intl.NumberFormat("id-ID", { style:"currency", currency:"IDR" }).format(n).replace("EFA", "EFA ");
}

function fmtTemp(n){
  if(n===undefined||n===null||isNaN(n)) return "-";
  return `${n}°C`;
}

function esc(str){
  if(!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function truncate(str, max=200){
  if(!str) return "";
  return str.length > max ? str.slice(0,max)+"…" : str;
}

/* ============================================================
   DETEKSI MAKSUD (INTENT)
   ============================================================ */
function detectIntent(rawText){
  const t = norm(rawText);

  // Small talk
  if(/\b(bantuan|help|menu|perintah|bisa apa|bisa bantu apa|apa saja yang bisa|fitur apa|kamu bisa apa|tolong)\b/.test(t)) return "smalltalk_help";
  if(/\b(terima ?kasih|makasih|thanks|thank you|tengkyu|matursuwun)\b/.test(t)) return "smalltalk_thanks";
  if(/\b(dadah|sampai jumpa|selamat tinggal|bye|goodbye|dadah|da da)\b/.test(t)) return "smalltalk_bye";
  if(/\b(halo+|hai+|hello|hi|hey|assalamualaikum|salam|pagi|siang|sore|malam)\b/.test(t) || /\bapa ?kabar\b/.test(t) || /\bselamat (pagi|siang|sore|malam)\b/.test(t)) return "smalltalk_greeting";
  if(/\b(aku rindu|kangen|rindu)\b/.test(t)) return "smalltalk_miss";
  if(/\b(apa kabar|kabar|gimana kabar|how are you)\b/.test(t)) return "smalltalk_howareyou";
  if(/\b(merah|biru|kuning|hijau|ungu|hitam|putih|warna|favorit|kesukaan)\b.*\b(warna|color)\b/.test(t)) return "smalltalk_color";
  if(/\b(makanan|makan|kuliner|masakan|food)\b/.test(t)) return "smalltalk_food";
  if(/\b(pacar|cinta|sayang|jodoh|love)\b/.test(t)) return "smalltalk_love";
  if(/\b(lelucon|joke|humor|lucu|funny)\b/.test(t)) return "smalltalk_joke";
  if(/\b(umur|usia|berapa tua|old)\b/.test(t)) return "smalltalk_age";
  if(/\b(nama|siapa namamu|namamu|your name)\b/.test(t)) return "smalltalk_name";
  if(/\b(kamu (dari|asal)|dari mana|where (are you from|from))\b/.test(t)) return "smalltalk_origin";

  // Data UFN
  if(/\b(daftar|list|semua|seluruh|mana saja)\b.*\b(negara|country)\b/.test(t) || /\bnegara.*daftar\b/.test(t) || /\bsebutkan negara\b/.test(t)) return "list_countries";
  if(/\b(deskripsi|tentang|info|informasi|profil|sekilas|gambaran)\b/.test(t) && /\bnegara\b/.test(t)) return "country_profile";
  if(/\b(ibu ?kota|ibukota|capitalCity|capitalCitys?)\b/.test(t)) return "capitalCity";
  if(/\bbahasa (apa|resmi)\b|\bbahasa yang di ?pakai\b|\bbahasa yang di ?gunakan\b|\b(pakai|gunakan) bahasa\b|\blanguage\b/.test(t)) return "language";
  if(/\b(mata ?uang terkuat|nilai tukar tertinggi|mata uang paling tinggi|kurs tertinggi)\b/.test(t)) return "currency_strongest";
  if(/\bmata ?uang|kurs|currency|currencies|matauang|nilai tukar\b/.test(t)) return "currency";
  if(/\b(populasi terbesar|populasi terbanyak|paling banyak|tertinggi|terbesar)\b.*\b(populasi|penduduk)\b/.test(t) || /\bpopulasi terbesar\b/.test(t)) return "population_max";
  if(/\bpopulasi|penduduk|population\b/.test(t)) return "population";
  if(/\b(berita|news|informasi terbaru)\b.*\b(terbaru|hari ini|terkini|update)\b/.test(t) || /\b(ada berita apa|berita apa saja|berita terkini)\b/.test(t)) return "latest_news";
  if(/\bringkas|rangkum|ringkasan|resume|summary\b/.test(t)) return "summary_news";
  if(/\b(reaksi|like|suka|respon|popularitas)\b.*\b(paling banyak|terbanyak|tertinggi)\b|\bberita.*paling.*reaksi\b/.test(t)) return "top_reaction";
  if(/\b(komentar|comment|comments|diskusi|tanggapan)\b/.test(t)) return "comments";
  if(/\b(tempat menarik|menarik|parimenarik|lokasi|objek menarik|destinasi|tempat rekomendasi|tempat bagus)\b/.test(t)) return "places";
  if(/\b(kategori|category|jenis|jenis berita)\b/.test(t)) return "news_category";
  if(/\b(penulis|author|penulis berita|wartawan)\b/.test(t)) return "news_author";
  if(/\b(gambar|image|foto|photo|thumbnail)\b/.test(t)) return "news_image";
  if(/\b(bandingkan|dibanding|vs|versus|perbedaan antara|perbandingan)\b/.test(t)) return "compare";
  if(/\b(cuaca|weather|suhu|temp|temperature|hujan|cerah|berawan)\b/.test(t)) return "weather";

  return "general_country";
}

// --- COUNTRY HANDLERS ---

async function handleListCountries(){
  const countries = await loadCountries();
  if(!countries.length) return "Belum ada data negara di database UFN.";
  const list = countries.map(c => `<li><strong>${esc(c.name)}</strong>${c.description ? ` — ${esc(c.description)}` : ''}</li>`).join("");
  return `🌍 Daftar negara anggota UFN:<ul>${list}</ul><span class="hint">Total ${countries.length} negara terdaftar.</span>`;
}

async function handleCountryProfile(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  if(!c) return NOT_FOUND;
  
  let info = "";
  if(c.flag) info += `<img src="${esc(c.flag)}" alt="Bendera ${esc(c.name)}" class="flag-img">`;
  info += `<strong>🏛️ ${esc(c.name)}</strong>`;
  if(c.description) info += `<br><br>${esc(c.description)}`;
  if(c.createdAt) info += `<br><br><span class="hint">Bergabung: ${fmtDate(c.createdAt)}</span>`;
  if(c.capitalCity) info += `<br><span class="hint">Ibu kota: ${esc(c.capitalCity)}</span>`;
  if(c.population) info += `<br><span class="hint">Populasi: ${fmtNumber(c.population)} jiwa</span>`;
  if(c.language) info += `<br><span class="hint">Bahasa: ${esc(c.language)}</span>`;
  if(c.weather && c.weather.temp !== undefined) info += `<br><span class="hint">Cuaca saat ini: ${fmtNumber(c.weather.temp)}°C</span>`;
  return info;
}

async function handlecapitalCity(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  if(!c) return NOT_FOUND;
  if(!c.capitalCity) return `Data ibu kota untuk ${esc(c.name)} belum tersedia.`;
  return `🏙️ Ibu kota <strong>${esc(c.name)}</strong> adalah <strong>${esc(c.capitalCity)}</strong>.`;
}

async function handleLanguage(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  if(!c) return NOT_FOUND;
  if(!c.language) return `Data bahasa untuk ${esc(c.name)} belum tersedia.`;
  return `🗣️ Bahasa yang digunakan di <strong>${esc(c.name)}</strong> adalah <strong>${esc(c.language)}</strong>.`;
}

async function handleCurrency(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  if(!c) return NOT_FOUND;
  
  const currencies = await loadCurrencies();
  const cur = currencies.find(x => norm(x.country) === norm(c.name) || norm(x.name) === norm(c.name));
  if(cur){
    let info = `<strong>💱 ${esc(c.name)}</strong> menggunakan mata uang <strong>${esc(cur.name)}</strong> (${esc(cur.symbol||"")})`;
    if(cur.value !== undefined) info += `<br>Nilai saat ini: <strong>${fmtCurrency(cur.value)}</strong>`;
    if(cur.changePercent !== undefined) info += `<br>Perubahan: <strong>${cur.changePercent > 0 ? "📈" : "📉"} ${fmtNumber(cur.changePercent)}%</strong>`;
    if(cur.prevValue !== undefined) info += `<br>Nilai sebelumnya: ${fmtCurrency(cur.prevValue)}`;
    if(cur.updatedAt) info += `<br><span class="hint">Update terakhir: ${fmtDateTime(cur.updatedAt)}</span>`;
    return info;
  }
  return NOT_FOUND;
}

async function handleCurrencyStrongest(){
  const currencies = await loadCurrencies();
  if(!currencies.length) return NOT_FOUND;
  
  const valid = currencies.filter(c => c.value !== undefined && c.value !== null);
  if(!valid.length) return "Belum ada data nilai mata uang.";
  
  valid.sort((a,b) => b.value - a.value);
  const top = valid[0];
  
  let info = `🏆 Mata uang dengan nilai tukar tertinggi di UFN:<br><br>`;
  info += `<strong>${esc(top.name)}</strong> (${esc(top.symbol||"")})`;
  info += `<br>Negara: <strong>${esc(top.country||"Tidak diketahui")}</strong>`;
  info += `<br>Nilai: <strong>${fmtCurrency(top.value)}</strong>`;
  if(top.changePercent !== undefined) info += `<br>Perubahan: <strong>${top.changePercent > 0 ? "📈" : "📉"} ${fmtNumber(top.changePercent)}%</strong>`;
  if(top.updatedAt) info += `<br><span class="hint">Update: ${fmtDateTime(top.updatedAt)}</span>`;
  return info;
}

async function handlePopulation(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  if(!c) return NOT_FOUND;
  if(!c.population) return `Data populasi untuk ${esc(c.name)} belum tersedia.`;
  return `👥 Populasi <strong>${esc(c.name)}</strong> tercatat sekitar <strong>${fmtNumber(c.population)}</strong> jiwa.`;
}

async function handlePopulationMax(){
  const countries = await loadCountries();
  const withPop = countries.filter(c=>c.population!==undefined && c.population!==null);
  if(!withPop.length) return "Belum ada data populasi negara.";
  withPop.sort((a,b)=>b.population - a.population);
  const top = withPop[0];
  const second = withPop[1];
  let info = `👥 Negara dengan populasi terbesar di UFN adalah <strong>${esc(top.name)}</strong>, dengan sekitar <strong>${fmtNumber(top.population)}</strong> jiwa.`;
  if(second) info += `<br><span class="hint">Diikuti oleh ${esc(second.name)} dengan ${fmtNumber(second.population)} jiwa.</span>`;
  return info;
}

// --- WEATHER HANDLER ---

async function handleWeather(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  if(!c) return NOT_FOUND;
  if(!c.weather) return `Data cuaca untuk ${esc(c.name)} belum tersedia.`;
  
  const w = c.weather;
  let info = `🌤️ Cuaca di <strong>${esc(c.name)}</strong>:<br><br>`;
  
  // Weather condition with emoji
  const conditionMap = {
    'clear': '☀️ Cerah',
    'clouds': '☁️ Berawan',
    'rain': '🌧️ Hujan',
    'thunderstorm': '⛈️ Badai',
    'snow': '❄️ Salju',
    'mist': '🌫️ Kabut',
    'fog': '🌫️ Kabut',
    'haze': '🌫️ Kabut Asap',
    'smoke': '💨 Asap',
    'dust': '🌪️ Debu',
    'sand': '🏜️ Pasir'
  };
  const condition = w.conditionKey ? (conditionMap[w.conditionKey.toLowerCase()] || w.conditionKey) : 'Tidak diketahui';
  
  if(w.temp !== undefined) info += `🌡️ Suhu: <strong>${fmtTemp(w.temp)}</strong>`;
  if(w.feelsLike !== undefined) info += ` (terasa ${fmtTemp(w.feelsLike)})`;
  info += `<br>`;
  
  if(w.conditionKey) info += `☁️ Kondisi: <strong>${condition}</strong><br>`;
  if(w.humidity !== undefined) info += `💧 Kelembaban: <strong>${w.humidity}%</strong><br>`;
  if(w.windSpeed !== undefined) info += `💨 Kecepatan angin: <strong>${w.windSpeed} km/h</strong><br>`;
  if(w.pressure !== undefined) info += `📊 Tekanan: <strong>${w.pressure} hPa</strong><br>`;
  if(w.UV !== undefined) info += `☀️ UV Index: <strong>${w.UV}</strong><br>`;
  if(w.visibility !== undefined) info += `👁️ Visibilitas: <strong>${w.visibility} km</strong><br>`;
  if(w.aqi !== undefined) info += `🌫️ Kualitas Udara (AQI): <strong>${w.aqi}</strong><br>`;
  if(w.rainChance !== undefined) info += `🌧️ Peluang hujan: <strong>${w.rainChance}%</strong><br>`;
  if(w.dewPoint !== undefined) info += `💧 Titik embun: <strong>${fmtTemp(w.dewPoint)}</strong><br>`;
  if(w.sunrise) info += `🌅 Matahari terbit: <strong>${w.sunrise}</strong><br>`;
  if(w.sunset) info += `🌇 Matahari terbenam: <strong>${w.sunset}</strong><br>`;
  if(w.updatedAt) info += `<br><span class="hint">Update terakhir: ${fmtDateTime(w.updatedAt)}</span>`;
  
  return info;
}

// --- NEWS HANDLERS ---

async function handleLatestNews(){
  const newsItems = await loadNews(5);
  if(!newsItems.length) return NOT_FOUND;
  const rows = newsItems.map(n => {
    const likes = n.likes || 0;
    return `<li><strong>${esc(n.title||"Tanpa judul")}</strong>${n.author ? ` <span class="hint">· ${esc(n.author)}</span>` : ''}${n.category ? ` <span class="hint">[${esc(n.category)}]</span>` : ''}<br><span class="hint">${fmtDate(n.createdAt)} · ${fmtNumber(likes)} suka</span></li>`;
  }).join("");
  return `📰 Berita terbaru di jaringan UFN:<ul>${rows}</ul>`;
}

async function handleSummaryNews(text){
  const newsItems = await loadNews(10);
  if(!newsItems.length) return NOT_FOUND;
  const n = findNewsInText(text, newsItems) || newsItems[0];
  const ringkasan = n.excrept || n.content || (n.content ? truncate(n.content, 300) : null);
  if(!ringkasan) return NOT_FOUND;
  let info = `📝 Ringkasan berita "<strong>${esc(n.title||"")}</strong>"`;
  if(n.author) info += ` oleh ${esc(n.author)}`;
  info += `:<br><br>${esc(ringkasan)}`;
  if(n.createdAt) info += `<br><span class="hint">${fmtDateTime(n.createdAt)}</span>`;
  if(n.likes !== undefined) info += ` · ${fmtNumber(n.likes)} suka`;
  if(n.category) info += ` · Kategori: ${esc(n.category)}`;
  return info;
}

async function handleNewsCategory(){
  const newsItems = await loadNews(30);
  const categories = {};
  for(const n of newsItems){
    if(n.category){
      categories[n.category] = (categories[n.category] || 0) + 1;
    }
  }
  if(!Object.keys(categories).length) return "Belum ada data kategori berita.";
  const list = Object.entries(categories)
    .sort((a,b)=>b[1]-a[1])
    .map(([cat, count]) => `<li><strong>${esc(cat)}</strong> — ${count} berita</li>`)
    .join("");
  return `📂 Kategori berita di UFN:<ul>${list}</ul>`;
}

async function handleNewsAuthor(text){
  const newsItems = await loadNews(30);
  if(!newsItems.length) return NOT_FOUND;
  
  const t = norm(text);
  let items = newsItems.filter(n => n.author && t.includes(norm(n.author)));
  if(!items.length) {
    const authors = {};
    for(const n of newsItems){
      if(n.author) authors[norm(n.author)] = n.author;
    }
    for(const [key, val] of Object.entries(authors)){
      if(t.includes(key)){
        items = newsItems.filter(n => norm(n.author) === key);
        break;
      }
    }
  }
  if(!items.length) return "Tidak ditemukan berita dari penulis tersebut.";
  
  const author = items[0].author;
  const rows = items.slice(0,5).map(n => 
    `<li><strong>${esc(n.title||"")}</strong>${n.category ? ` [${esc(n.category)}]` : ''}<br><span class="hint">${fmtDate(n.createdAt)}</span></li>`
  ).join("");
  return `✍️ Berita dari <strong>${esc(author)}</strong>:<ul>${rows}</ul>${items.length > 5 ? `<span class="hint">+${items.length-5} berita lainnya</span>` : ''}`;
}

async function handleNewsImage(text){
  const newsItems = await loadNews(10);
  if(!newsItems.length) return NOT_FOUND;
  const n = findNewsInText(text, newsItems) || newsItems[0];
  if(!n.image) return `Berita "<strong>${esc(n.title||"")}</strong>" tidak memiliki gambar.`;
  return `🖼️ Gambar untuk berita "<strong>${esc(n.title||"")}</strong>":<br><br><a href="${esc(n.image)}" target="_blank" style="color:var(--accent);">🔗 Lihat gambar</a><br><span class="hint">${esc(n.image)}</span>`;
}

async function handleTopReaction(){
  const newsItems = await loadNews(30);
  if(!newsItems.length) return NOT_FOUND;
  const reactions = await loadReactions();
  
  const reactionMap = {};
  for(const n of newsItems){
    let count = n.likes || 0;
    for(const r of reactions){
      if(r.userReactions && r.userReactions[n.id]) count += r.userReactions[n.id];
      if(r.counts && r.counts.like) count += r.counts.like;
    }
    reactionMap[n.id] = count;
  }
  
  const sorted = [...newsItems].sort((a,b) => (reactionMap[b.id]||0) - (reactionMap[a.id]||0));
  const top = sorted[0];
  if(!top || (reactionMap[top.id]||0) === 0) return "Belum ada data reaksi.";
  
  return `🏆 Berita dengan reaksi terbanyak adalah "<strong>${esc(top.title)}</strong>" dengan <strong>${fmtNumber(reactionMap[top.id])}</strong> reaksi.`;
}

async function handleComments(text){
  const newsItems = await loadNews(20);
  if(!newsItems.length) return NOT_FOUND;
  const t = norm(text);
  let n = findNewsInText(text, newsItems);
  if(!n) n = newsItems.find(x => t.includes(norm(x.title)));
  if(!n) return NOT_FOUND;
  
  const comments = await loadComments();
  const filtered = comments.filter(c => c.newsId === n.id);
  
  if(!filtered.length) return `Belum ada komentar pada berita "<strong>${esc(n.title)}</strong>".`;
  
  const rows = filtered.slice(0,10).map(c => {
    let info = `<li><strong>${esc(c.name||c.author||"Anonim")}</strong>: ${esc(c.text||"")}`;
    if(c.parentId) info += ` <span class="hint">(balasan ke komentar)</span>`;
    info += `<br><span class="hint">${fmtDateTime(c.createdAt)}</span>`;
    if(c.likedBy && c.likedBy.length) info += ` · ❤️ ${c.likedBy.length}`;
    return info + `</li>`;
  }).join("");
  return `💬 Komentar pada berita "<strong>${esc(n.title)}</strong>":<ul>${rows}</ul>${filtered.length > 10 ? `<span class="hint">+${filtered.length-10} komentar lainnya</span>` : ''}`;
}

async function handlePlaces(text){
  const countries = await loadCountries();
  const c = findCountryInText(text, countries);
  const places = await loadPlaces();
  
  if(!places.length) return "Belum ada data tempat menarik.";
  
  let filtered = places;
  if(c){
    filtered = places.filter(p => norm(p.ownerId) === norm(c.id) || norm(p.name) === norm(c.name));
  }
  
  if(!filtered.length){
    const t = norm(text);
    filtered = places.filter(p => t.includes(norm(p.name)) || (p.ownerId && t.includes(norm(p.ownerId))));
  }
  
  if(!filtered.length) filtered = places.slice(0,8);
  
  const items = filtered.slice(0,8).map(p => {
    const typeLabel = p.type === "negara" ? "🏛️ Negara" : p.type === "provinsi" ? "🏙️ Provinsi" : "📍";
    return `<li><strong>${esc(p.name)}</strong> ${typeLabel}${p.ownerId ? ` · ID: ${esc(p.ownerId)}` : ''}${p.x !== undefined && p.y !== undefined ? `<br><span class="hint">📍 ${fmtNumber(p.x)}, ${fmtNumber(p.y)}</span>` : ''}${p.createdAt ? `<br><span class="hint">${fmtDate(p.createdAt)}</span>` : ''}</li>`;
  }).join("");
  return `📍 Tempat menarik di UFN:<ul>${items}</ul>`;
}

async function handleCompare(text){
  const countries = await loadCountries();
  const found = findAllCountriesInText(text, countries);
  if(found.length < 2) return "Sebutkan dua negara yang ingin dibandingkan (contoh: 'bandingkan Indonesia dan Malaysia').";
  const [a,b] = found;
  const rows = [
    ["Nama", esc(a.name||"-"), esc(b.name||"-")],
    ["Deskripsi", esc((a.description||"-").slice(0,50)+(a.description?.length>50?"…":"")), esc((b.description||"-").slice(0,50)+(b.description?.length>50?"…":""))],
    ["Ibu Kota", esc(a.capitalCity||"-"), esc(b.capitalCity||"-")],
    ["Populasi", fmtNumber(a.population), fmtNumber(b.population)],
  ].map(([label, va, vb]) => `<tr><td>${label}</td><td>${va}</td><td>${vb}</td></tr>`).join("");
  return `📊 Perbandingan <strong>${esc(a.name)}</strong> vs <strong>${esc(b.name)}</strong>:<table><tr><th></th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr>${rows}</table>`;
}

}

}

function handleAge(){

function handleName(rawText){
  const t = norm(rawText||"");
  if(/\bnama\s*(saya|aku|gue|gua)\b/.test(t) || /\bsiapa\s*(saya|aku)\b/.test(t)){
    const name = getUserName();
    if(name) return `Nama Anda <strong>${esc(name)}</strong>! 😊 Saya ingat kok.`;
    return `Saya belum tahu nama Anda. Coba ketik, misalnya: "Nama saya Budi" agar saya ingat. 😊`;
  }
  return `Nama saya UFN AI Assistant! 🌍 Panggil saja UFN. Ada yang bisa saya bantu? 🤖`;
}

function handleOrigin(){
  return `Saya berasal dari data resmi UFN! 🌏 Saya ada di mana saja Anda membutuhkan saya. 💻`;
}

function handleMiss(){
  return ["Aku juga rindu! Tapi saya selalu di sini untuk Anda. 💙", "Rindu itu manis, seperti kerjasama UFN! 🤗"][Math.floor(Math.random()*2)];
}

/* ============================================================
   FUNGSI kirimAI (Worker) - DIPINDAHKAN KE ATAS
   ============================================================ */
async function kirimAI(prompt) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);

  try {
    const response = await fetch("https://ufnai.comedicentral58.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: prompt }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.success === false) {
      throw new Error(data.reply || "Worker menandakan kegagalan.");
    }

    if (typeof data.reply !== "string") {
      throw new Error("Respons Worker tidak memiliki 'reply' string.");
    }

    return data.reply;
  } catch (error) {
    clearTimeout(timeoutId);
    console.error("kirimAI error:", error);

    if (error.name === "AbortError") {
      return "Maaf, AI sedang tidak dapat dihubungi.";
    }

    return "Maaf, AI sedang tidak dapat dihubungi.";
  }
}

/* ============================================================
   ROUTER UTAMA
   ============================================================ */
async function generateAnswer(rawText){
  // === Lapisan memori nama — dicek paling awal ===
  const detectedName = tryExtractName(rawText);
  if(detectedName){
    setUserName(detectedName);
    updateHeaderSub();
    return `Senang berkenalan, <strong>${esc(detectedName)}</strong>! 👋 Saya akan mengingat nama Anda. Ada yang bisa saya bantu seputar UFN?`;
  }

  // === Lapisan Custom Commands (ai_commands) — dicek lebih dulu ===
  const customAnswer = matchCustomCommand(rawText);
  if(customAnswer !== null) return customAnswer;
  // === Jika tidak ada command yang cocok, lanjut ke sistem AI lama ===

  const intent = detectIntent(rawText);

  // === Small talk tetap diproses di sini ===
  switch(intent){
    case "smalltalk_greeting": return handleGreeting();
    case "smalltalk_help": return handleHelp();
    case "smalltalk_thanks": return handleThanks();
    case "smalltalk_bye": return handleBye();
    case "smalltalk_howareyou": return handleHowAreYou();
    case "smalltalk_color": return handleColor();
    case "smalltalk_food": return handleFood();
    case "smalltalk_love": return handleLove();
    case "smalltalk_joke": return handleJoke();
    case "smalltalk_age": return handleAge();
    case "smalltalk_name": return handleName(rawText);
    case "smalltalk_origin": return handleOrigin();
    case "smalltalk_miss": return handleMiss();
  }

  if(!firebaseReady){
    // Jika Firebase tidak siap, coba AI Worker
    return await kirimAI(rawText);
  }
  
  try{
    let answer = null;
    switch(intent){
      case "list_countries": answer = await handleListCountries(); break;
      case "country_profile": answer = await handleCountryProfile(rawText); break;
      case "capitalCity": answer = await handlecapitalCity(rawText); break;
      case "language": answer = await handleLanguage(rawText); break;
      case "currency": answer = await handleCurrency(rawText); break;
      case "currency_strongest": answer = await handleCurrencyStrongest(); break;
      case "population": answer = await handlePopulation(rawText); break;
      case "population_max": answer = await handlePopulationMax(); break;
      case "weather": answer = await handleWeather(rawText); break;
      case "latest_news": answer = await handleLatestNews(); break;
      case "summary_news": answer = await handleSummaryNews(rawText); break;
      case "news_category": answer = await handleNewsCategory(); break;
      case "news_author": answer = await handleNewsAuthor(rawText); break;
      case "news_image": answer = await handleNewsImage(rawText); break;
      case "top_reaction": answer = await handleTopReaction(); break;
      case "comments": answer = await handleComments(rawText); break;
      case "places": answer = await handlePlaces(rawText); break;
      case "compare": answer = await handleCompare(rawText); break;
      default: answer = await handleGeneralCountry(rawText); break;
    }

    // Jika jawaban adalah NOT_FOUND, FETCH_ERROR, atau "Belum ada data ..." (fallback) panggil Worker
    if (
      answer === NOT_FOUND ||
      answer === FETCH_ERROR ||
      (typeof answer === "string" && answer.includes("Belum ada data")) ||
      (typeof answer === "string" && answer.includes("Maaf"))
    ) {
      return await kirimAI(rawText);
    }

    return answer;
  }catch(err){
    console.error("Kesalahan di generateAnswer:", err);
    return await kirimAI(rawText);
  }
}

/* ============================================================
   UI — CHAT ENGINE
   ============================================================ */
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearChat");
const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const statusDot = document.getElementById("statusDot");
const suggestBtn = document.getElementById("suggestBtn");
const quickReplies = document.getElementById("quickReplies");

const ICON_SUN = '<path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-6.66 1.42-1.42M4.92 19.08l1.42-1.42M19.08 19.08l-1.42-1.42M4.92 4.92 6.34 6.34"/><circle cx="12" cy="12" r="5"/>';
const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

let chatMemory = [];

function timeNow(ts){
  return new Date(ts||Date.now()).toLocaleTimeString("id-ID",{ hour:"2-digit", minute:"2-digit" });
}

function updateHeaderSub(){
  const el = document.getElementById("headerSub");
  if(!el) return;
  const name = getUserName();
  el.textContent = name ? `AI BY RIFQY · Halo, ${name}` : "AI BY RIFQY";
}

function appendMessage(role, html, { animate=true, save=true, ts=Date.now() } = {}){
  const row = document.createElement("div");
  row.className = `msg-row ${role}`;
  row.innerHTML = `
    <div class="avatar ${role}">${role==="ai" ? "◈" : "☺"}</div>
    <div class="msg-col">
      <div class="bubble">${html}</div>
      <div class="timestamp">${timeNow(ts)}</div>
    </div>`;
  if(!animate) row.style.animation = "none";
  chatEl.appendChild(row);
  scrollToBottom();
  if(save){
    chatMemory.push({ role, html, ts });
    saveChatHistory(chatMemory);
  }
  return row;
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "msg-row ai";
  row.id = "typingRow";
  row.innerHTML = `
    <div class="avatar ai">◈</div>
    <div class="msg-col">
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>`;
  chatEl.appendChild(row);
  scrollToBottom();
}
function hideTyping(){
  document.getElementById("typingRow")?.remove();
}
function scrollToBottom(){
  requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; });
}

async function handleSend(){
  const text = inputEl.value.trim();
  if(!text) return;
  appendMessage("user", esc(text));
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;
  statusDot.textContent = "● memproses";
  showTyping();

  const started = Date.now();
  const answer = await generateAnswer(text);
  const elapsed = Date.now() - started;
  const minDelay = 350;
  if(elapsed < minDelay) await new Promise(r=>setTimeout(r, minDelay - elapsed));

  hideTyping();
  appendMessage("ai", answer);
  sendBtn.disabled = false;
  statusDot.textContent = "● siap";
  inputEl.focus();
}

// Quick replies
quickReplies.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  inputEl.value = btn.dataset.q;
  handleSend();
});

  chatEl.innerHTML = "";
  chatMemory = [];

});

themeToggle.addEventListener("click", ()=>{
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  themeIcon.innerHTML = next === "dark" ? ICON_MOON : ICON_SUN;
});

/* Inisialisasi: pulihkan riwayat chat dari localStorage jika ada, atau tampilkan sambutan */

if(savedHistory.length){
  chatMemory = [];
  savedHistory.forEach(m => appendMessage(m.role, m.html, { animate:false, ts:m.ts }));

  showWelcome();
}

}
