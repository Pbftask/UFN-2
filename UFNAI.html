<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>UFN AI · Asisten Resmi</title>
    <meta name="description" content="Asisten AI resmi Union of Federated Nations (UFN) — informasi negara, berita, mata uang, dan tempat berdasarkan data resmi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & VARIABEL ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --gold: #c6a15b;
            --gold-soft: #e2c98a;
            --blue-accent: #5c86ad;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        /* Tema gelap (default) */
        html[data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-chat: #161b22;
            --bg-input: #0d1117;
            --bg-user-msg: #2d333b;
            --bg-ai-msg: #1c2128;
            --bg-hover: #30363d;
            --border-subtle: #30363d;
            --border-strong: #484f58;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            --ring-glow: rgba(198, 161, 91, 0.15);
        }

        /* Tema terang */
        html[data-theme="light"] {
            --bg-body: #ffffff;
            --bg-chat: #f7f7f8;
            --bg-input: #ffffff;
            --bg-user-msg: #e5e5ea;
            --bg-ai-msg: #f0f0f2;
            --bg-hover: #e5e5ea;
            --border-subtle: #d9d9e3;
            --border-strong: #b0b0bf;
            --text-primary: #1e1e2a;
            --text-secondary: #5c5c70;
            --text-muted: #8e8ea0;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            --ring-glow: rgba(198, 161, 91, 0.12);
        }

        /* ===== BASE ===== */
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            color: var(--text-primary);
            transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== APP ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 820px;
            margin: 0 auto;
            background-color: var(--bg-body);
            position: relative;
        }

        /* ===== HEADER (minimalis) ===== */
        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background-color: var(--bg-body);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            z-index: 5;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .emblem {
            width: 32px;
            height: 32px;
            flex: none;
            position: relative;
        }
        .emblem svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .emblem .ring {
            transform-origin: 50% 50%;
            animation: spin 24s linear infinite;
        }
        .emblem .core {
            animation: pulse 2.8s ease-in-out infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .brand {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand .highlight {
            color: var(--gold-soft);
        }
        .brand .sub {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 6px;
            letter-spacing: 0.2px;
        }

        .top-actions {
            display: flex;
            gap: 4px;
            flex: none;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s var(--ease), transform 0.15s var(--ease), color 0.2s;
        }
        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .icon-btn:active {
            transform: scale(0.93);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== CHAT AREA ===== */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--bg-chat);
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar {
            width: 5px;
        }
        #chat::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 6px;
        }

        /* ===== PESAN ===== */
        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 100%;
            animation: rise 0.3s var(--ease) both;
        }
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            user-select: none;
            flex-shrink: 0;
        }
        .avatar.ai {
            background: var(--bg-ai-msg);
            color: var(--gold-soft);
            border-color: var(--border-subtle);
        }
        .avatar.user {
            background: var(--bg-user-msg);
            color: var(--text-primary);
        }

        .msg-col {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .msg-row.user .msg-col {
            align-items: flex-end;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-x: auto;
            background: var(--bg-ai-msg);
            border: 1px solid var(--border-subtle);
            transition: background 0.2s, border-color 0.2s;
        }
        .msg-row.ai .bubble {
            border-top-left-radius: 4px;
            background: var(--bg-ai-msg);
        }
        .msg-row.user .bubble {
            border-top-right-radius: 4px;
            background: var(--bg-user-msg);
            border-color: var(--border-subtle);
        }

        /* gaya inline di dalam bubble */
        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 6px;
            font-size: 13px;
        }
        .bubble th,
        .bubble td {
            padding: 5px 8px;
            border-bottom: 1px solid var(--border-subtle);
            text-align: left;
        }
        .bubble th {
            color: var(--text-secondary);
            font-weight: 500;
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .bubble ul {
            margin: 6px 0 0;
            padding-left: 20px;
        }
        .bubble li {
            margin-bottom: 3px;
        }
        .bubble strong {
            color: var(--gold-soft);
            font-weight: 600;
        }
        .bubble .hint {
            color: var(--text-secondary);
            font-size: 12.5px;
        }
        .bubble .error {
            color: #d4766a;
        }
        .bubble .flag-img {
            display: block;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border: 1px solid var(--border-subtle);
        }
        .bubble a {
            color: var(--gold-soft);
            text-decoration: none;
            border-bottom: 1px dotted var(--gold-soft);
        }
        .bubble a:hover {
            opacity: 0.8;
        }

        .timestamp {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
            letter-spacing: 0.2px;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.2s ease-in-out infinite;
        }
        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* ===== INPUT BAR ===== */
        .input-bar {
            padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
            background-color: var(--bg-body);
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .input-shell {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 6px 6px 6px 16px;
            transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }
        .input-shell:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--ring-glow);
        }

        textarea#userInput {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            max-height: 120px;
            padding: 8px 0;
            min-height: 24px;
        }
        textarea#userInput::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex: none;
            border: none;
            cursor: pointer;
            background: var(--gold);
            color: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s var(--ease), background 0.2s, opacity 0.2s;
        }
        .send-btn:hover {
            background: var(--gold-soft);
            transform: scale(1.04);
        }
        .send-btn:active {
            transform: scale(0.92);
        }
        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .send-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== QUICK REPLIES (chip) ===== */
        .quick-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 2px 2px;
        }
        .quick-wrap button {
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s var(--ease);
            font-family: var(--font-sans);
            white-space: nowrap;
            background: var(--bg-body);
        }
        .quick-wrap button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }

        /* ===== STATUS ===== */
        .status-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 4px 4px 0;
            font-size: 10.5px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            gap: 6px;
        }
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3fb950;
            transition: background 0.3s;
        }
        .status-dot.busy {
            background: #d29922;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 640px) {
            .app {
                border-left: 1px solid var(--border-subtle);
                border-right: 1px solid var(--border-subtle);
                box-shadow: var(--shadow);
            }
            .msg-col {
                max-width: 78%;
            }
        }

        @media (max-width: 480px) {
            .brand .sub {
                display: none;
            }
            .top {
                padding: 10px 12px;
            }
            #chat {
                padding: 12px 12px 6px;
            }
            .bubble {
                font-size: 13.5px;
                padding: 8px 12px;
            }
            .quick-wrap button {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        /* aksesibilitas */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001s !important;
                transition-duration: 0.001s !important;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- HEADER minimal -->
        <header class="top">
            <div class="logo-area">
                <div class="emblem" aria-hidden="true">
                    <svg viewBox="0 0 44 44" fill="none">
                        <circle class="ring" cx="22" cy="22" r="17" stroke="var(--gold)" stroke-width="1.1" stroke-dasharray="2 5"/>
                        <circle cx="22" cy="22" r="12.5" stroke="var(--border-subtle)" stroke-width="1"/>
                        <circle class="core" cx="22" cy="22" r="4.2" fill="var(--gold)"/>
                        <path d="M22 9.5 L22 34.5 M9.5 22 L34.5 22" stroke="var(--border-subtle)" stroke-width="0.7"/>
                    </svg>
                </div>
                <div class="brand">
                    <span class="highlight">UFN</span> AI
                    <span class="sub">· Asisten Resmi</span>
                </div>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="themeToggle" title="Ganti tema" aria-label="Ganti tema">
                    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-6.66 1.42-1.42M4.92 19.08l1.42-1.42M19.08 19.08l-1.42-1.42M4.92 4.92 6.34 6.34"/><circle cx="12" cy="12" r="5"/></svg>
                </button>
                <button class="icon-btn" id="clearChat" title="Hapus riwayat" aria-label="Hapus chat">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
                </button>
                <button class="icon-btn" id="suggestBtn" title="Saran pertanyaan" aria-label="Saran">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </button>
            </div>
        </header>

        <!-- CHAT -->
        <main id="chat" aria-live="polite"></main>

        <!-- INPUT -->
        <footer class="input-bar">
            <div class="input-shell">
                <textarea id="userInput" rows="1" placeholder="Tanya apa saja tentang UFN…" aria-label="Tulis pertanyaan"></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Kirim">
                    <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
                </button>
            </div>

            <div class="quick-wrap" id="quickReplies">
                <button data-q="Daftar negara UFN">📋 Negara</button>
                <button data-q="Mata uang terkuat">💰 Mata Uang</button>
                <button data-q="Berita terbaru">📰 Berita</button>
                <button data-q="Populasi terbesar">👥 Populasi</button>
                <button data-q="Cuaca di Indonesia">🌤️ Cuaca</button>
                <button data-q="Tempat menarik UFN">📍 Menarik</button>
            </div>

            <div class="status-row">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusLabel">siap</span>
            </div>
        </footer>

    </div>

    <script type="module">
        // ================================================================
        // FIREBASE IMPOR
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, query, orderBy, limit, getDocs, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4HuTmEgiowYaBH3doN2INZD5chk9NG-U",
            authDomain: "puki-678bf.firebaseapp.com",
            databaseURL: "https://puki-678bf-default-rtdb.firebaseio.com",
            projectId: "puki-678bf",
            storageBucket: "puki-678bf.firebasestorage.app",
            messagingSenderId: "343647284151",
            appId: "1:343647284151:web:c26e7f5f75235c187a1632"
        };

        let db, firebaseReady = false;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            firebaseReady = true;
            console.log("✅ Firebase terhubung");
        } catch (err) {
            console.error("❌ Firebase gagal:", err);
        }

        // ================================================================
        // CACHE & HELPERS
        // ================================================================
        const cache = { countries: null, news: null, currencies: null, places: null, reactions: null, comments: null };

        const NOT_FOUND = "Maaf, data tersebut belum tersedia di database UFN.";
        const FETCH_ERROR = "Maaf, terjadi kendala saat menghubungi database UFN.";

        async function loadCountries() {
            if (cache.countries) return cache.countries;
            try {
                const snap = await getDocs(collection(db, "countries"));
                cache.countries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return cache.countries;
            } catch { return []; }
        }

        async function loadNews(limitCount = 20) {
            if (cache.news) return cache.news;
            try {
                const q = query(collection(db, "news"), orderBy("createdAt", "desc"), limit(limitCount));
                const snap = await getDocs(q);
                cache.news = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch {
                try {
                    const snap = await getDocs(collection(db, "news"));
                    cache.news = snap.docs.map(d => ({ id: d.id, ...d.data() })).slice(0, limitCount);
                } catch { cache.news = []; }
            }
            return cache.news;
        }

        async function loadCurrencies() {
            if (cache.currencies) return cache.currencies;
            try {
                const snap = await getDocs(collection(db, "currencies"));
                cache.currencies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return cache.currencies;
            } catch { return []; }
        }

        async function loadPlaces() {
            if (cache.places) return cache.places;
            try {
                const snap = await getDocs(collection(db, "places"));
                cache.places = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return cache.places;
            } catch { return []; }
        }

        async function loadReactions() {
            if (cache.reactions) return cache.reactions;
            try {
                const snap = await getDocs(collection(db, "reactions"));
                cache.reactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return cache.reactions;
            } catch { return []; }
        }

        async function loadComments() {
            if (cache.comments) return cache.comments;
            try {
                const snap = await getDocs(collection(db, "comments"));
                cache.comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return cache.comments;
            } catch { return []; }
        }

        function norm(s) { return (s || "").toString().toLowerCase().normalize("NFKD").replace(/[^\w\s]/g, "").trim(); }

        function esc(str) {
            if (!str) return "";
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function fmtDate(ts) {
            try {
                const d = ts?.toDate ? ts.toDate() : new Date(ts);
                if (isNaN(d)) return "-";
                return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
            } catch { return "-"; }
        }

        function fmtDateTime(ts) {
            try {
                const d = ts?.toDate ? ts.toDate() : new Date(ts);
                if (isNaN(d)) return "-";
                return d.toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit",
                    minute: "2-digit" });
            } catch { return "-"; }
        }

        function fmtNumber(n) {
            if (n === undefined || n === null || isNaN(n)) return "-";
            return Number(n).toLocaleString("id-ID");
        }

        function fmtCurrency(n) {
            if (n === undefined || n === null || isNaN(n)) return "-";
            return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR" }).format(n).replace("EFA", "EFA ");
        }

        function fmtTemp(n) {
            if (n === undefined || n === null || isNaN(n)) return "-";
            return `${n}°C`;
        }

        function truncate(str, max = 200) {
            if (!str) return "";
            return str.length > max ? str.slice(0, max) + "…" : str;
        }

        function findCountryInText(text, countries) {
            const t = norm(text);
            let best = null;
            for (const c of countries) {
                const name = norm(c.name);
                if (name && t.includes(name)) {
                    if (!best || name.length > norm(best.name).length) best = c;
                }
            }
            return best;
        }

        function findAllCountriesInText(text, countries) {
            const t = norm(text);
            return countries.filter(c => norm(c.name) && t.includes(norm(c.name)));
        }

        function findNewsInText(text, newsItems) {
            const t = norm(text);
            let best = null;
            for (const n of newsItems) {
                const title = norm(n.title);
                if (title && t.includes(title)) {
                    if (!best || title.length > norm(best.title).length) best = n;
                }
            }
            return best;
        }

        // ================================================================
        // CUSTOM COMMANDS (ai_commands) — lapisan tambahan
        // ================================================================
        let customCommandsCache = [];
        let customCommandsUnsub = null;

        function initCustomCommandsListener() {
            if (!db) return;
            try {
                if (customCommandsUnsub) customCommandsUnsub();
                customCommandsUnsub = onSnapshot(
                    collection(db, "ai_commands"),
                    (snap) => {
                        customCommandsCache = snap.docs
                            .map(d => ({ id: d.id, ...d.data() }))
                            .filter(cmd => cmd.enabled === true)
                            .sort((a, b) => (Number(a.priority) || 0) - (Number(b.priority) || 0));
                        console.log(`✅ Custom commands: ${customCommandsCache.length} aktif`);
                    },
                    (err) => { console.error("❌ ai_commands listener error:", err); }
                );
            } catch (err) { console.error("❌ Gagal init ai_commands:", err); }
        }

        function matchCustomCommand(rawText) {
            if (!customCommandsCache.length) return null;
            const message = String(rawText ?? "");
            for (const cmd of customCommandsCache) {
                if (!Array.isArray(cmd.keywords) || typeof cmd.answer !== "string") continue;
                const ignoreCase = cmd.ignoreCase !== false;
                const useContains = cmd.contains !== false;
                const compareMessage = ignoreCase ? message.toLowerCase() : message;
                const isMatch = cmd.keywords.some(keyword => {
                    if (typeof keyword !== "string") return false;
                    const compareKeyword = ignoreCase ? keyword.toLowerCase() : keyword;
                    return useContains ? compareMessage.includes(compareKeyword) : compareMessage === compareKeyword;
                });
                if (isMatch) return cmd.answer;
            }
            return null;
        }

        // ================================================================
        // INTENT DETECTION (disederhanakan)
        // ================================================================
        function detectIntent(rawText) {
            const t = norm(rawText);
            if (/\b(bantuan|help|menu|bisa apa|tolong)\b/.test(t)) return "smalltalk_help";
            if (/\b(terima ?kasih|makasih|thanks)\b/.test(t)) return "smalltalk_thanks";
            if (/\b(dadah|sampai jumpa|bye|goodbye)\b/.test(t)) return "smalltalk_bye";
            if (/\b(halo+|hai+|hello|hi|hey|assalamualaikum|salam|pagi|siang|sore|malam)\b/.test(t) || /\bapa ?kabar\b/.test(
                    t)) return "smalltalk_greeting";
            if (/\b(aku rindu|kangen|rindu)\b/.test(t)) return "smalltalk_miss";
            if (/\b(apa kabar|kabar|how are you)\b/.test(t)) return "smalltalk_howareyou";
            if (/\b(lelucon|joke|humor|lucu)\b/.test(t)) return "smalltalk_joke";
            if (/\b(nama|siapa namamu|your name)\b/.test(t)) return "smalltalk_name";
            if (/\b(daftar|list|semua|mana saja)\b.*\b(negara|country)\b/.test(t)) return "list_countries";
            if (/\b(deskripsi|tentang|info|profil)\b.*\bnegara\b/.test(t)) return "country_profile";
            if (/\b(ibu ?kota|ibukota)\b/.test(t)) return "capitalCity";
            if (/\bbahasa (apa|resmi)\b|\bbahasa yang di ?pakai\b|\blanguage\b/.test(t)) return "language";
            if (/\bmata ?uang terkuat|nilai tukar tertinggi|kurs tertinggi\b/.test(t)) return "currency_strongest";
            if (/\bmata ?uang|kurs|currency|nilai tukar\b/.test(t)) return "currency";
            if (/\bpopulasi terbesar|paling banyak.*populasi\b/.test(t)) return "population_max";
            if (/\bpopulasi|penduduk|population\b/.test(t)) return "population";
            if (/\b(berita|news).*(terbaru|hari ini|terkini)\b|berita terbaru\b/.test(t)) return "latest_news";
            if (/\bringkas|rangkum|ringkasan|resume\b/.test(t)) return "summary_news";
            if (/\btempat menarik|parimenarik|lokasi|destinasi\b/.test(t)) return "places";
            if (/\bbandingkan|vs|versus|perbedaan antara\b/.test(t)) return "compare";
            if (/\b(cuaca|weather|suhu|hujan|cerah)\b/.test(t)) return "weather";
            return "general_country";
        }

        // ================================================================
        // HANDLERS (singkat)
        // ================================================================
        const JOKES = [
            "Kenapa UFN tidak pernah ribut? Karena semua negara sepakat damai... dan kalau tidak, ada sanksi! 😄",
            "Apa persamaan UFN dan koper? Sama-sama tempat menyimpan barang berharga! 😄",
            "Kenapa berita UFN selalu menarik? Karena setiap hari ada cerita baru! 📰",
        ];

        function handleGreeting() {
            return `Halo! 👋 Saya UFN AI Assistant.<br><br>💡 <strong>Ketik "bantuan"</strong> untuk melihat daftar perintah.<br>🌤️ Coba: "Cuaca di Indonesia" atau "Berita terbaru"`;
        }

        function handleHelp() {
            return `🤖 Saya bisa membantu dengan:<ul>
            <li><strong>🏛️ Daftar Negara</strong> — "Daftar negara UFN"</li>
            <li><strong>ℹ️ Profil Negara</strong> — "Info [negara]"</li>
            <li><strong>🌤️ Cuaca</strong> — "Cuaca di [negara]"</li>
            <li><strong>💰 Mata Uang</strong> — "Mata uang [negara]" / "Mata uang terkuat"</li>
            <li><strong>👥 Populasi</strong> — "Populasi [negara]" / "Populasi terbesar"</li>
            <li><strong>📰 Berita Terbaru</strong> — "Berita terbaru"</li>
            <li><strong>📍 Tempat Menarik</strong> — "Tempat menarik"</li>
            <li><strong>📊 Perbandingan</strong> — "Bandingkan [negaraA] dan [negaraB]"</li>
          </ul><span class="hint">Anda juga bisa mengobrol santai!</span>`;
        }

        // --- COUNTRY HANDLERS ---
        async function handleListCountries() {
            const countries = await loadCountries();
            if (!countries.length) return "Belum ada data negara.";
            const list = countries.map(c =>
                `<li><strong>${esc(c.name)}</strong>${c.description ? ` — ${esc(c.description)}` : ''}</li>`
            ).join("");
            return `🌍 Daftar negara anggota UFN:<ul>${list}</ul><span class="hint">Total ${countries.length} negara.</span>`;
        }

        async function handleCountryProfile(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            let info =
                `<strong>🏛️ ${esc(c.name)}</strong>`;
            if (c.description) info += `<br><br>${esc(c.description)}`;
            if (c.capitalCity) info += `<br>🏙️ Ibu kota: <strong>${esc(c.capitalCity)}</strong>`;
            if (c.population) info += `<br>👥 Populasi: <strong>${fmtNumber(c.population)}</strong> jiwa`;
            if (c.language) info += `<br>🗣️ Bahasa: <strong>${esc(c.language)}</strong>`;
            if (c.weather?.temp !== undefined) info += `<br>🌡️ Suhu: <strong>${fmtTemp(c.weather.temp)}</strong>`;
            return info;
        }

        async function handleCapitalCity(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            if (!c.capitalCity) return `Data ibu kota ${esc(c.name)} belum tersedia.`;
            return `🏙️ Ibu kota <strong>${esc(c.name)}</strong> adalah <strong>${esc(c.capitalCity)}</strong>.`;
        }

        async function handleLanguage(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            if (!c.language) return `Data bahasa ${esc(c.name)} belum tersedia.`;
            return `🗣️ Bahasa di <strong>${esc(c.name)}</strong>: <strong>${esc(c.language)}</strong>.`;
        }

        async function handleCurrency(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            const currencies = await loadCurrencies();
            const cur = currencies.find(x => norm(x.country) === norm(c.name) || norm(x.name) === norm(c.name));
            if (!cur) return NOT_FOUND;
            let info = `<strong>💱 ${esc(c.name)}</strong> → <strong>${esc(cur.name)}</strong> (${esc(cur.symbol || "")})`;
            if (cur.value !== undefined) info += `<br>Nilai: <strong>${fmtCurrency(cur.value)}</strong>`;
            if (cur.changePercent !== undefined) info +=
                `<br>Perubahan: <strong>${cur.changePercent > 0 ? "📈" : "📉"} ${fmtNumber(cur.changePercent)}%</strong>`;
            return info;
        }

        async function handleCurrencyStrongest() {
            const currencies = await loadCurrencies();
            const valid = currencies.filter(c => c.value !== undefined && c.value !== null);
            if (!valid.length) return "Belum ada data nilai mata uang.";
            valid.sort((a, b) => b.value - a.value);
            const top = valid[0];
            return `🏆 Mata uang tertinggi: <strong>${esc(top.name)}</strong> (${esc(top.country || "")})<br>Nilai: <strong>${fmtCurrency(top.value)}</strong>`;
        }

        async function handlePopulation(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            if (!c.population) return `Data populasi ${esc(c.name)} belum tersedia.`;
            return `👥 Populasi <strong>${esc(c.name)}</strong>: <strong>${fmtNumber(c.population)}</strong> jiwa.`;
        }

        async function handlePopulationMax() {
            const countries = await loadCountries();
            const withPop = countries.filter(c => c.population !== undefined && c.population !== null);
            if (!withPop.length) return "Belum ada data populasi.";
            withPop.sort((a, b) => b.population - a.population);
            const top = withPop[0];
            return `👥 Populasi terbesar: <strong>${esc(top.name)}</strong> dengan <strong>${fmtNumber(top.population)}</strong> jiwa.`;
        }

        async function handleWeather(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            if (!c.weather) return `Data cuaca ${esc(c.name)} belum tersedia.`;
            const w = c.weather;
            let info = `🌤️ Cuaca di <strong>${esc(c.name)}</strong>:<br>`;
            if (w.temp !== undefined) info += `🌡️ <strong>${fmtTemp(w.temp)}</strong>`;
            if (w.conditionKey) info += ` · ${esc(w.conditionKey)}`;
            if (w.humidity !== undefined) info += `<br>💧 Kelembaban: <strong>${w.humidity}%</strong>`;
            if (w.windSpeed !== undefined) info += `<br>💨 Angin: <strong>${w.windSpeed} km/h</strong>`;
            return info;
        }

        async function handleLatestNews() {
            const news = await loadNews(5);
            if (!news.length) return NOT_FOUND;
            const rows = news.map(n =>
                `<li><strong>${esc(n.title || "")}</strong>${n.author ? ` <span class="hint">· ${esc(n.author)}</span>` : ''}<br><span class="hint">${fmtDate(n.createdAt)}</span></li>`
            ).join("");
            return `📰 Berita terbaru UFN:<ul>${rows}</ul>`;
        }

        async function handleSummaryNews(text) {
            const news = await loadNews(10);
            if (!news.length) return NOT_FOUND;
            const n = findNewsInText(text, news) || news[0];
            const ringkasan = n.excrept || n.content || (n.content ? truncate(n.content, 300) : null);
            if (!ringkasan) return NOT_FOUND;
            return `📝 Ringkasan "<strong>${esc(n.title)}</strong>":<br><br>${esc(ringkasan)}<br><span class="hint">${fmtDateTime(n.createdAt)}</span>`;
        }

        async function handlePlaces(text) {
            const places = await loadPlaces();
            if (!places.length) return "Belum ada data tempat menarik.";
            const items = places.slice(0, 8).map(p =>
                `<li><strong>${esc(p.name)}</strong> ${p.type || ''}${p.ownerId ? ` · ${esc(p.ownerId)}` : ''}</li>`
            ).join("");
            return `📍 Tempat menarik di UFN:<ul>${items}</ul>`;
        }

        async function handleCompare(text) {
            const countries = await loadCountries();
            const found = findAllCountriesInText(text, countries);
            if (found.length < 2) return "Sebutkan dua negara (contoh: 'bandingkan Indonesia dan Malaysia').";
            const [a, b] = found;
            const rows = [
                ["Nama", esc(a.name), esc(b.name)],
                ["Ibu Kota", esc(a.capitalCity || "-"), esc(b.capitalCity || "-")],
                ["Populasi", fmtNumber(a.population), fmtNumber(b.population)],
            ].map(([label, va, vb]) => `<tr><td>${label}</td><td>${va}</td><td>${vb}</td></tr>`).join("");
            return `📊 Perbandingan <strong>${esc(a.name)}</strong> vs <strong>${esc(b.name)}</strong>:<table><tr><th></th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr>${rows}</table>`;
        }

        async function handleGeneralCountry(text) {
            const countries = await loadCountries();
            const c = findCountryInText(text, countries);
            if (!c) return NOT_FOUND;
            let info = `<strong>🏛️ ${esc(c.name)}</strong>`;
            if (c.description) info += `<br><br>${esc(c.description)}`;
            if (c.capitalCity) info += `<br>🏙️ Ibu kota: <strong>${esc(c.capitalCity)}</strong>`;
            if (c.population) info += `<br>👥 Populasi: <strong>${fmtNumber(c.population)}</strong> jiwa`;
            return info;
        }

        // === SMALL TALK ===
        function handleThanks() {
            return ["Sama-sama! 😊", "Senang membantu! 🤗"][Math.floor(Math.random() * 2)];
        }

        function handleBye() {
            return ["Sampai jumpa! 👋", "Dadah! 🌺"][Math.floor(Math.random() * 2)];
        }

        function handleHowAreYou() {
            return ["Baik, terima kasih! 😊", "Baik-baik saja! 💪"][Math.floor(Math.random() * 2)];
        }

        function handleJoke() { return JOKES[Math.floor(Math.random() * JOKES.length)]; }

        function handleName() { return "Nama saya UFN AI Assistant! 🌍"; }

        function handleMiss() { return ["Aku juga rindu! 💙", "Rindu itu manis! 🤗"][Math.floor(Math.random() * 2)]; }

        // ================================================================
        // WORKER (fallback)
        // ================================================================
        async function kirimAI(prompt) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);
            try {
                const res = await fetch("https://ufnai.comedicentral58.workers.dev/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: prompt }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.success === false) throw new Error(data.reply || "Worker error");
                return data.reply || "Maaf, AI tidak mengenali prompt tersebut.";
            } catch {
                clearTimeout(timeoutId);
                return "Maaf, terjadi kendala. Coba lagi nanti.";
            }
        }

        // ================================================================
        // ROUTER UTAMA
        // ================================================================
        async function generateAnswer(rawText) {
            // Custom commands dulu
            const customAnswer = matchCustomCommand(rawText);
            if (customAnswer !== null) return customAnswer;

            const intent = detectIntent(rawText);

            switch (intent) {
                case "smalltalk_greeting":
                    return handleGreeting();
                case "smalltalk_help":
                    return handleHelp();
                case "smalltalk_thanks":
                    return handleThanks();
                case "smalltalk_bye":
                    return handleBye();
                case "smalltalk_howareyou":
                    return handleHowAreYou();
                case "smalltalk_joke":
                    return handleJoke();
                case "smalltalk_name":
                    return handleName();
                case "smalltalk_miss":
                    return handleMiss();
            }

            if (!firebaseReady) return await kirimAI(rawText);

            try {
                let answer = null;
                switch (intent) {
                    case "list_countries":
                        answer = await handleListCountries();
                        break;
                    case "country_profile":
                        answer = await handleCountryProfile(rawText);
                        break;
                    case "capitalCity":
                        answer = await handleCapitalCity(rawText);
                        break;
                    case "language":
                        answer = await handleLanguage(rawText);
                        break;
                    case "currency":
                        answer = await handleCurrency(rawText);
                        break;
                    case "currency_strongest":
                        answer = await handleCurrencyStrongest();
                        break;
                    case "population":
                        answer = await handlePopulation(rawText);
                        break;
                    case "population_max":
                        answer = await handlePopulationMax();
                        break;
                    case "weather":
                        answer = await handleWeather(rawText);
                        break;
                    case "latest_news":
                        answer = await handleLatestNews();
                        break;
                    case "summary_news":
                        answer = await handleSummaryNews(rawText);
                        break;
                    case "places":
                        answer = await handlePlaces(rawText);
                        break;
                    case "compare":
                        answer = await handleCompare(rawText);
                        break;
                    default:
                        answer = await handleGeneralCountry(rawText);
                        break;
                }
                if (answer === NOT_FOUND || answer === FETCH_ERROR || answer?.includes("Belum ada data") || answer
                    ?.includes("Maaf")) {
                    return await kirimAI(rawText);
                }
                return answer;
            } catch {
                return await kirimAI(rawText);
            }
        }

        // ================================================================
        // UI ENGINE
        // ================================================================
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const clearBtn = document.getElementById("clearChat");
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        const statusDot = document.getElementById("statusDot");
        const statusLabel = document.getElementById("statusLabel");
        const suggestBtn = document.getElementById("suggestBtn");
        const quickReplies = document.getElementById("quickReplies");

        const ICON_SUN =
            '<path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-6.66 1.42-1.42M4.92 19.08l1.42-1.42M19.08 19.08l-1.42-1.42M4.92 4.92 6.34 6.34"/><circle cx="12" cy="12" r="5"/>';
        const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

        function timeNow() {
            return new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
        }

        function appendMessage(role, html, { animate = true } = {}) {
            const row = document.createElement("div");
            row.className = `msg-row ${role}`;
            const avatarLabel = role === "ai" ? "◈" : "☺";
            row.innerHTML = `
            <div class="avatar ${role}">${avatarLabel}</div>
            <div class="msg-col">
              <div class="bubble">${html}</div>
              <div class="timestamp">${timeNow()}</div>
            </div>`;
            if (!animate) row.style.animation = "none";
            chatEl.appendChild(row);
            scrollToBottom();
            return row;
        }

        function showTyping() {
            const row = document.createElement("div");
            row.className = "msg-row ai";
            row.id = "typingRow";
            row.innerHTML = `
            <div class="avatar ai">◈</div>
            <div class="msg-col">
              <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
            </div>`;
            chatEl.appendChild(row);
            scrollToBottom();
        }

        function hideTyping() { document.getElementById("typingRow")?.remove(); }

        function scrollToBottom() {
            requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
        }

        function setStatus(busy) {
            statusDot.className = `status-dot${busy ? ' busy' : ''}`;
            statusLabel.textContent = busy ? 'memproses…' : 'siap';
        }

        async function handleSend() {
            const text = inputEl.value.trim();
            if (!text) return;
            appendMessage("user", esc(text));
            inputEl.value = "";
            inputEl.style.height = "auto";
            sendBtn.disabled = true;
            setStatus(true);
            showTyping();

            const started = Date.now();
            const answer = await generateAnswer(text);
            const elapsed = Date.now() - started;
            const minDelay = 300;
            if (elapsed < minDelay) await new Promise(r => setTimeout(r, minDelay - elapsed));

            hideTyping();
            appendMessage("ai", answer);
            sendBtn.disabled = false;
            setStatus(false);
            inputEl.focus();
        }

        // ===== EVENT =====
        sendBtn.addEventListener("click", handleSend);
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault();
                handleSend(); }
        });
        inputEl.addEventListener("input", () => {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
        });

        quickReplies.addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;
            inputEl.value = btn.dataset.q;
            handleSend();
        });

        const SUGGESTIONS = [
            "Daftar negara UFN", "Mata uang terkuat", "Berita terbaru",
            "Populasi terbesar", "Cuaca di Indonesia", "Tempat menarik UFN",
            "Bandingkan Indonesia dan Malaysia", "Info Amerika Serikat", "Ceritakan lelucon!"
        ];
        suggestBtn.addEventListener("click", () => {
            const random = SUGGESTIONS[Math.floor(Math.random() * SUGGESTIONS.length)];
            inputEl.value = random;
            inputEl.focus();
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
        });

        clearBtn.addEventListener("click", () => {
            chatEl.innerHTML = "";
            showWelcome();
        });

        themeToggle.addEventListener("click", () => {
            const html = document.documentElement;
            const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
            html.setAttribute("data-theme", next);
            themeIcon.innerHTML = next === "dark" ? ICON_MOON : ICON_SUN;
        });

        function showWelcome() {
            appendMessage("ai",
                `Selamat datang di <strong>UFN AI Assistant</strong> 👋<br><br>💡 <strong>Ketik "bantuan"</strong> untuk melihat semua perintah.<br>🌤️ Coba: "Cuaca di Indonesia" atau "Berita terbaru"`,
                { animate: false }
            );
        }
        showWelcome();

        // ===== INIT CUSTOM COMMANDS =====
        if (firebaseReady) initCustomCommandsListener();

        if (!firebaseReady) {
            appendMessage("ai", `⚠️ Firebase tidak terhubung. Beberapa fitur mungkin terbatas.<br><br>${handleHelp()}`, { animate: false });
        }
    </script>
</body>
</html>
