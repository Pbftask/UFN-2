<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UFN - Negara Fiksi</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
  :root{
    --color-bg: #0F172A;
    --color-surface: #1B2942;
    --color-surface-hi: #243456;
    --color-outline: #2A3A5C;
    --color-scrim: rgba(6, 11, 25, 0.8);
    --color-text-primary: #E7ECF7;
    --color-text-secondary: #98A6C3;
    --color-text-disabled: #5C6C8C;
    --color-gold: #F2B84B;
    --color-gold-hi: #FFCB66;
    --color-gold-dim: #B8873A;
    --color-gold-on: #241705;
    --color-danger: #F2755A;
    --color-success: #4ADE80;
    --radius-card: 16px;
    --radius-sheet: 24px;
    --radius-pill: 999px;
    --shadow-1: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-2: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-3: 0 8px 24px rgba(0,0,0,0.5);
    --shadow-gold: 0 8px 20px rgba(242, 184, 75, 0.3);
    --ease-standard: cubic-bezier(0.2, 0.0, 0, 1.0);
    --ease-emphasized: cubic-bezier(0.3, 0.0, 0.1, 1.0);
    --dur-fast: 200ms;
    --dur-medium: 300ms;
    --dur-slow: 400ms;
    --font-body: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; background: #0F172A; }

  body{
    background: radial-gradient(circle at 20% 0%, #16213A 0%, #0F172A 60%, #090E1C 100%);
    color: var(--color-text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar{ width: 6px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--color-outline); border-radius: var(--radius-pill); }

  button{ font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea{ font-family: inherit; color: inherit; }

  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--color-gold);
    outline-offset: 2px;
  }

  .app-shell{
    max-width: 820px;
    margin: 0 auto;
    padding: 0 16px 120px;
    position: relative;
  }

  /* ===== HEADER MINIMALIS ===== */
  .app-header{
    padding: 16px 0 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, #0F172A 60%, rgba(15,23,42,0));
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .header-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .header-left{
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .header-icon{
    width: 32px;
    height: 32px;
    background: var(--color-gold);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-gold-on);
    font-weight: 800;
    font-size: 14px;
    flex-shrink: 0;
  }

  .header-title{
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #F5F7FC, #C8D2E8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-right{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .online-badge{
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--color-text-secondary);
    background: var(--color-surface);
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--color-outline);
  }
  .online-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ADE80;
    display: inline-block;
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot{
    0%,100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: 0.5; transform: scale(0.8); }
  }

  .admin-btn{
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--color-outline);
    transition: all 0.2s;
    background: var(--color-surface);
    color: var(--color-text-secondary);
  }
  .admin-btn:hover{ border-color: var(--color-gold-dim); color: var(--color-gold); }
  .admin-btn.is-admin{
    background: var(--color-gold);
    color: var(--color-gold-on);
    border-color: var(--color-gold);
  }
  .admin-btn.is-admin:hover{ opacity: 0.85; }

  /* ===== SEARCH BAR ===== */
  .search-bar{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-outline);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    margin-top: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-bar:focus-within{
    border-color: var(--color-gold-dim);
    box-shadow: 0 0 0 3px rgba(242, 184, 75, 0.1);
  }
  .search-bar__icon{
    flex-shrink: 0;
    color: var(--color-text-secondary);
    width: 16px;
    height: 16px;
  }
  .search-bar__input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 14px;
    color: var(--color-text-primary);
    min-width: 0;
  }
  .search-bar__input::placeholder{ color: var(--color-text-disabled); }
  .search-bar__clear{
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-secondary);
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
    transition: all 0.2s;
  }
  .search-bar__clear.is-visible{ opacity: 1; transform: scale(1); pointer-events: auto; }
  .search-bar__clear:hover{ background: rgba(255,255,255,0.06); }

  /* ===== TABS ===== */
  .tabs{
    display: flex;
    gap: 4px;
    background: var(--color-surface);
    border-radius: var(--radius-pill);
    padding: 4px;
    margin: 12px 0 10px;
    border: 1px solid var(--color-outline);
  }
  .tab{
    flex: 1;
    padding: 8px 12px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    transition: all 0.2s;
    color: var(--color-text-secondary);
  }
  .tab.active{
    background: var(--color-gold);
    color: var(--color-gold-on);
  }
  .tab:hover:not(.active){ background: rgba(255,255,255,0.04); }
  .tab i{ margin-right: 4px; font-size: 12px; }

  /* ===== COUNTRY LIST ===== */
  .country-list{ display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .country-list.is-hidden{ display: none; }

  .country-card{
    background: var(--color-surface);
    border: 1px solid var(--color-outline);
    border-radius: var(--radius-card);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: card-enter 0.3s ease-out both;
  }
  @keyframes card-enter{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .country-card:hover{ border-color: var(--color-gold-dim); }
  .country-card.is-open{
    border-color: var(--color-gold-dim);
    box-shadow: var(--shadow-2);
  }

  .country-card__head{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    text-align: left;
    min-height: 52px;
  }

  .country-card__flag{
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--color-outline);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .country-card__flag img{ width: 100%; height: 100%; object-fit: cover; }
  .country-card__flag i{ color: var(--color-text-disabled); font-size: 14px; }

  .country-card__name{
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text-primary);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .country-card__chevron{
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.04);
    transition: all 0.2s;
  }
  .country-card.is-open .country-card__chevron{
    background: var(--color-gold);
    transform: rotate(180deg);
  }
  .country-card__chevron svg{
    width: 16px;
    height: 16px;
    color: var(--color-text-secondary);
    transition: color 0.2s;
  }
  .country-card.is-open .country-card__chevron svg{ color: var(--color-gold-on); }

  .country-card__body{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s cubic-bezier(0.3, 0, 0.1, 1);
  }
  .country-card.is-open .country-card__body{ grid-template-rows: 1fr; }

  .country-card__body-inner{ overflow: hidden; min-height: 0; }

  .country-card__flag-large{
    margin: 0 14px 12px;
    border-radius: 12px;
    overflow: hidden;
    height: 130px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--color-outline);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(-4px);
    transition: all 0.25s ease 40ms;
  }
  .country-card.is-open .country-card__flag-large{
    opacity: 1;
    transform: translateY(0);
  }
  .country-card__flag-large img{ width: 100%; height: 100%; object-fit: cover; }
  .country-card__flag-large.is-empty i{ font-size: 28px; color: var(--color-text-disabled); }

  .country-card__desc{
    margin: 0;
    padding: 0 14px 8px;
    color: var(--color-text-secondary);
    font-size: 13.5px;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(-4px);
    transition: all 0.25s ease 60ms;
  }
  .country-card.is-open .country-card__desc{
    opacity: 1;
    transform: translateY(0);
  }

  .country-card__detail{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    padding: 0 14px 8px;
    font-size: 12.5px;
    color: var(--color-text-secondary);
    opacity: 0;
    transition: opacity 0.25s ease 80ms;
  }
  .country-card.is-open .country-card__detail{ opacity: 1; }
  .country-card__detail .label{ color: var(--color-text-disabled); }
  .country-card__detail .value{ color: var(--color-text-primary); }

  .country-card__weather{
    padding: 0 14px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 16px;
    font-size: 12px;
    color: var(--color-text-secondary);
    opacity: 0;
    transition: opacity 0.25s ease 100ms;
  }
  .country-card.is-open .country-card__weather{ opacity: 1; }
  .country-card__weather .w-item{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
  }
  .country-card__weather .w-item i{
    width: 16px;
    color: var(--color-text-disabled);
    font-size: 13px;
  }
  .country-card__weather .w-item .w-label{
    color: var(--color-text-disabled);
    font-size: 11px;
  }
  .country-card__weather .w-item .w-value{
    color: var(--color-text-primary);
    font-weight: 500;
    margin-left: auto;
  }

  .country-card__footer{
    padding: 0 14px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--color-text-disabled);
    opacity: 0;
    transition: opacity 0.25s ease 120ms;
  }
  .country-card.is-open .country-card__footer{ opacity: 1; }

  .btn-delete{
    background: rgba(242, 117, 90, 0.12);
    color: var(--color-danger);
    padding: 3px 12px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .btn-delete:hover{ background: var(--color-danger); color: #fff; }

  .pop-change{
    font-size: 11px;
    padding: 1px 8px;
    border-radius: var(--radius-pill);
    display: inline-block;
    margin-left: 4px;
  }
  .pop-change.up{ color: var(--color-success); background: rgba(74, 222, 128, 0.1); }
  .pop-change.down{ color: var(--color-danger); background: rgba(242, 117, 90, 0.1); }

  /* ===== SKELETON ===== */
  .skeleton-wrap{ display: none; flex-direction: column; gap: 10px; }
  .skeleton-wrap.is-visible{ display: flex; }
  .skeleton-card{
    height: 52px;
    border-radius: var(--radius-card);
    background: linear-gradient(100deg, var(--color-surface) 30%, var(--color-surface-hi) 50%, var(--color-surface) 70%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
    border: 1px solid var(--color-outline);
  }
  @keyframes skeleton-shimmer{
    0%{ background-position: 160% 0; }
    100%{ background-position: -60% 0; }
  }

  /* ===== EMPTY STATE ===== */
  .empty-state{
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    color: var(--color-text-secondary);
    text-align: center;
  }
  .empty-state.is-visible{ display: flex; }
  .empty-state__icon{ font-size: 40px; margin-bottom: 10px; opacity: 0.4; }
  .empty-state__title{ font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 2px; }
  .empty-state__subtitle{ font-size: 13px; color: var(--color-text-disabled); }

  /* ===== LEADERBOARD ===== */
  .leaderboard-wrap{ display: none; }
  .leaderboard-wrap.is-visible{ display: block; }
  .leaderboard-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--color-surface);
    border-radius: 12px;
    margin-bottom: 6px;
    border: 1px solid var(--color-outline);
  }
  .leaderboard-item .rank{
    font-size: 16px;
    font-weight: 800;
    color: var(--color-gold);
    width: 30px;
    text-align: center;
  }
  .leaderboard-item .flag-small{
    width: 28px;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .leaderboard-item .flag-small img{ width: 100%; height: 100%; object-fit: cover; }
  .leaderboard-item .info{ flex: 1; min-width: 0; }
  .leaderboard-item .info .name{ font-weight: 600; font-size: 14px; }
  .leaderboard-item .info .pop{ font-size: 12px; color: var(--color-text-secondary); }
  .leaderboard-item .capital{ font-size: 12px; color: var(--color-text-disabled); }

  /* ===== FAB ===== */
  .fab{
    position: fixed;
    right: 18px;
    bottom: 24px;
    width: 56px;
    height: 56px;
    border-radius: var(--radius-pill);
    background: linear-gradient(145deg, var(--color-gold-hi), var(--color-gold));
    color: var(--color-gold-on);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-gold), var(--shadow-2);
    z-index: 30;
    transition: transform 0.25s cubic-bezier(0.3, 0, 0.1, 1), box-shadow 0.2s;
  }
  .fab:active{ transform: scale(0.92); }
  .fab.is-hidden{ display: none; }
  .fab__icon{ width: 24px; height: 24px; transition: transform 0.3s; }
  .fab.is-modal-open .fab__icon{ transform: rotate(135deg); }

  .fab__ripple{
    position: absolute;
    border-radius: 50%;
    background: rgba(36, 23, 5, 0.3);
    transform: scale(0);
    pointer-events: none;
    animation: ripple-anim 0.6s ease;
  }
  @keyframes ripple-anim{
    to{ transform: scale(4); opacity: 0; }
  }

  /* ===== MODAL ===== */
  .modal-scrim{
    position: fixed;
    inset: 0;
    background: var(--color-scrim);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  @media (min-width: 640px){ .modal-scrim{ align-items: center; } }
  .modal-scrim.is-visible{ opacity: 1; pointer-events: auto; }

  .modal-sheet{
    width: 100%;
    max-width: 500px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--color-bg);
    border: 1px solid var(--color-outline);
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0));
    box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    transform: translateY(20px) scale(0.98);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.3, 0, 0.1, 1), opacity 0.25s ease;
  }
  @media (min-width: 640px){
    .modal-sheet{ border-radius: var(--radius-sheet); transform: translateY(10px) scale(0.96); }
  }
  .modal-scrim.is-visible .modal-sheet{
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .modal-sheet__handle{
    width: 36px;
    height: 4px;
    border-radius: var(--radius-pill);
    background: var(--color-outline);
    margin: 0 auto 16px;
  }
  @media (min-width: 640px){ .modal-sheet__handle{ display: none; } }

  .modal-sheet__title{ font-size: 18px; font-weight: 700; margin-bottom: 2px; }
  .modal-sheet__subtitle{ font-size: 13px; color: var(--color-text-secondary); margin-bottom: 16px; }

  .field{ margin-bottom: 14px; }
  .field__label{
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .field__control{
    width: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-outline);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--color-text-primary);
    outline: none;
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field__control::placeholder{ color: var(--color-text-disabled); }
  .field__control:focus{
    border-color: var(--color-gold-dim);
    box-shadow: 0 0 0 3px rgba(242, 184, 75, 0.08);
  }
  .field__error{
    font-size: 11px;
    color: var(--color-danger);
    margin-top: 4px;
    opacity: 0;
    transform: translateY(-3px);
    transition: all 0.2s;
  }
  .field__error.is-visible{ opacity: 1; transform: translateY(0); }

  /* Upload area */
  .upload-area{
    background: var(--color-surface);
    border: 2px dashed var(--color-outline);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .upload-area:hover{ border-color: var(--color-gold-dim); }
  .upload-area.has-file{ border-color: var(--color-success); }
  .upload-area input[type="file"]{
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .upload-area__icon{ font-size: 28px; color: var(--color-text-disabled); margin-bottom: 4px; }
  .upload-area__text{ font-size: 13px; color: var(--color-text-secondary); }
  .upload-area__text strong{ color: var(--color-gold); }
  .upload-area__preview{
    display: none;
    margin-top: 8px;
    position: relative;
  }
  .upload-area__preview img{
    max-height: 80px;
    border-radius: 8px;
    border: 1px solid var(--color-outline);
  }
  .upload-area__preview .remove-btn{
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--color-danger);
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload-area__loading{
    display: none;
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }
  .upload-area__loading i{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .field__control-flag{
    display: none;
  }

  .modal-sheet__actions{
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .btn{
    padding: 10px 20px;
    border-radius: var(--radius-pill);
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn:active{ transform: scale(0.96); }
  .btn--ghost{ background: transparent; color: var(--color-text-secondary); }
  .btn--ghost:hover{ background: rgba(255,255,255,0.05); color: var(--color-text-primary); }
  .btn--primary{

async function uploadToImgbb(file) {
  if (IMGBB_API_KEY === "YOUR_IMGBB_API_KEY") {

  }
  
  const formData = new FormData();

  formData.append("key", IMGBB_API_KEY);
  
  try {
    const res = await fetch("https://api.imgbb.com/1/upload", { 
      method: "POST", 
      body: formData 
    });
    const data = await res.json();
    
    if (!data.success) {
      console.error("ImgBB error:", data.error);
      throw new Error(data.error?.message || "Upload gagal");
    }
    return data.data.url;
  } catch (error) {
    console.error("Upload error:", error);
    throw error;
  }
}

// ===== POPULASI OTOMATIS =====
async function updatePopulation() {
  console.log("🔄 Memperbarui populasi...");
  const now = new Date();
  const hour = now.getHours();
  
  const lastUpdateRef = doc(firestore, "system", "populationLastUpdate");
  try {
    const snap = await getDoc(lastUpdateRef);
    const lastHour = snap.exists() ? snap.data().hour : -1;
    if (lastHour === hour) {
      console.log("⏳ Populasi sudah diupdate jam ini");
      return;
    }
  } catch (e) { console.warn("Gagal cek last update:", e); }

  const snapshot = await getDoc(countriesRef);
  const countries = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  
  let updated = 0;
  for (const country of countries) {
    const currentPop = country.population || 1000000;
    const changePercent = random(2, 5);
    const direction = Math.random() > 0.5 ? 1 : -1;
    const change = currentPop * (changePercent / 100) * direction;
    const newPop = Math.max(100, Math.round(currentPop + change));
    
    const changeHistory = country.populationHistory || [];
    changeHistory.push({
      from: currentPop,
      to: newPop,
      percent: changePercent * direction,
      time: new Date().toISOString()
    });
    if (changeHistory.length > 50) changeHistory.shift();
    
    await updateDoc(doc(firestore, "countries", country.id), {
      population: newPop,
      lastPopulationUpdate: serverTimestamp(),
      populationHistory: changeHistory.slice(-10)
    });
    updated++;
  }
  
  await setDoc(lastUpdateRef, { hour, updatedAt: serverTimestamp() }, { merge: true });
  if (updated > 0) {
    Toast.show(`Populasi ${updated} negara diperbarui!`, "success", 2000);
  }
  console.log(`✅ Populasi ${updated} negara diupdate`);
}

            <div class="country-card__detail">
              <span><span class="label">Ibukota</span><br><span class="value">${escapeHtml(c.capitalCity||'-')}</span></span>
              <span><span class="label">Bahasa</span><br><span class="value">${escapeHtml(c.language||'-')}</span></span>
              <span><span class="label">Populasi</span><br><span class="value">${formatNumber(c.population)} ${popChange}</span></span>
              <span><span class="label">Luas</span><br><span class="value">${formatNumber(c.area)} km²</span></span>
            </div>
            <div class="country-card__weather">
              ${weatherHTML}
            </div>
            <div class="country-card__footer">
              <span>🗓️ ${formatDate(c.createdAt)}</span>
              ${deleteBtn}
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("");

  attachDeleteEvents();
  syncAccordion();
}

function renderLeaderboard() {
  const sorted = [...State.allCountries].filter(c => c.population > 0).sort((a,b) => (b.population||0) - (a.population||0));
  if (!sorted.length) {
    DOM.leaderboardList.innerHTML = `<div class="empty-state is-visible" style="display:flex;"><p class="empty-state__title">Belum ada data populasi</p></div>`;
    return;
  }
  DOM.leaderboardList.innerHTML = sorted.map((c,i) => {
    const hasFlag = c.flag && c.flag.trim();
    let popChange = '';
    const history = c.populationHistory || [];
    if (history.length > 0) {
      const last = history[history.length - 1];
      const pct = last.percent || 0;
      if (pct > 0) popChange = `<span class="pop-change up">▲ ${pct.toFixed(1)}%</span>`;
      else if (pct < 0) popChange = `<span class="pop-change down">▼ ${Math.abs(pct).toFixed(1)}%</span>`;
    }
    return `
      <div class="leaderboard-item">
        <div class="rank">#${i+1}</div>
        <div class="flag-small">${hasFlag ? `<img src="${escapeHtml(c.flag)}" alt="">` : `<i class="fas fa-flag" style="color:var(--color-text-disabled);"></i>`}</div>
        <div class="info">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="pop">👥 ${formatNumber(c.population)} ${popChange}</div>
        </div>
        <div class="capital">${escapeHtml(c.capitalCity||'-')}</div>
      </div>
    `;
  }).join("");
}

function switchTab(tab) {
  State.currentTab = tab;
  DOM.tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  if (tab === "list") {
    DOM.countryList.classList.remove("is-hidden");
    DOM.leaderboardWrap.classList.remove("is-visible");
    DOM.emptyState.style.display = State.allCountries.length === 0 && !State.isFirstLoad ? "flex" : "none";
    renderList();
  } else {
    DOM.countryList.classList.add("is-hidden");
    DOM.emptyState.style.display = "none";
    DOM.leaderboardWrap.classList.add("is-visible");
    renderLeaderboard();
  }
}

// ===== ACCORDION =====
function syncAccordion() {
  document.querySelectorAll(".country-card").forEach(card => {
    const isOpen = card.dataset.id === State.openCardId;
    card.classList.toggle("is-open", isOpen);
    card.querySelector(".country-card__head")?.setAttribute("aria-expanded", String(isOpen));
  });
}

function toggleCard(id) {
  State.openCardId = State.openCardId === id ? null : id;
  syncAccordion();
}

// ===== DELETE =====
function attachDeleteEvents() {
  document.querySelectorAll(".btn-delete").forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id, name = btn.dataset.name;
      if (!id || !confirm(`Hapus "${name}"?`)) return;
      try {
        await deleteDoc(doc(firestore, "countries", id));
        Toast.show(`"${name}" dihapus`, "success");
      } catch { Toast.show("Gagal hapus", "error"); }
    };
  });
}

// ===== SEARCH =====
const handleSearch = debounce((val) => {
  State.searchTerm = val;
  if (State.currentTab === "list") renderList();
});
DOM.searchInput.addEventListener("input", (e) => {
  const v = e.target.value;
  DOM.searchClear.classList.toggle("is-visible", v.length > 0);
  handleSearch(v);
});
DOM.searchClear.addEventListener("click", () => {
  DOM.searchInput.value = "";
  DOM.searchClear.classList.remove("is-visible");
  State.searchTerm = "";
  if (State.currentTab === "list") renderList();
  DOM.searchInput.focus();
});

// ===== MODAL TAMBAH =====
function resetForm() {
  DOM.addForm.reset();
  DOM.inputFlagUrl.value = "";
  DOM.uploadPreview.style.display = "none";
  DOM.uploadArea.classList.remove("has-file");
  DOM.flagFile.value = "";
  DOM.inputPopulation.value = "1000000";
  ["name","desc","capital","language","population","area","flag"].forEach(f => {
    const el = {name:DOM.errorName, desc:DOM.errorDesc, capital:DOM.errorCapital, language:DOM.errorLanguage, population:DOM.errorPopulation, area:DOM.errorArea, flag:DOM.errorFlag}[f];
    if (el) el.classList.remove("is-visible");
  });
}

function showError(field, msg) {
  const map = {name:DOM.errorName, desc:DOM.errorDesc, capital:DOM.errorCapital, language:DOM.errorLanguage, population:DOM.errorPopulation, area:DOM.errorArea, flag:DOM.errorFlag};
  if (map[field]) { map[field].textContent = msg; map[field].classList.add("is-visible"); }
}

function clearError(field) {
  const map = {name:DOM.errorName, desc:DOM.errorDesc, capital:DOM.errorCapital, language:DOM.errorLanguage, population:DOM.errorPopulation, area:DOM.errorArea, flag:DOM.errorFlag};
  if (map[field]) map[field].classList.remove("is-visible");
}

DOM.flagFile.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) { Toast.show("Pilih file gambar", "error"); return; }
  if (file.size > 10 * 1024 * 1024) { Toast.show("Maksimal 10MB", "error"); return; }

  DOM.uploadLoading.style.display = "block";
  DOM.uploadArea.classList.add("has-file");

  const reader = new FileReader();
  reader.onload = (ev) => {
    DOM.previewImg.src = ev.target.result;
    DOM.uploadPreview.style.display = "block";
  };
  reader.readAsDataURL(file);

  try {
    const url = await uploadToImgbb(file);
    DOM.inputFlagUrl.value = url;
    DOM.uploadLoading.style.display = "none";
    Toast.show("Bendera terupload!", "success");
  } catch (err) {
    DOM.uploadLoading.style.display = "none";
    Toast.show("Gagal upload: " + err.message, "error");
    DOM.inputFlagUrl.value = "";
    DOM.uploadPreview.style.display = "none";
    DOM.uploadArea.classList.remove("has-file");
    DOM.flagFile.value = "";
  }
});

DOM.removeFlag.addEventListener("click", (e) => {
  e.stopPropagation();
  DOM.flagFile.value = "";
  DOM.inputFlagUrl.value = "";
  DOM.uploadPreview.style.display = "none";
  DOM.uploadArea.classList.remove("has-file");
});

DOM.uploadArea.addEventListener("dragover", (e) => { e.preventDefault(); DOM.uploadArea.style.borderColor = "var(--color-gold)"; });
DOM.uploadArea.addEventListener("dragleave", () => { DOM.uploadArea.style.borderColor = ""; });
DOM.uploadArea.addEventListener("drop", (e) => {
  e.preventDefault();
  DOM.uploadArea.style.borderColor = "";
  if (e.dataTransfer.files.length) DOM.flagFile.files = e.dataTransfer.files;
  DOM.flagFile.dispatchEvent(new Event("change"));
});

function openModal() {
  if (!State.isAdmin) { Toast.show("Login admin dulu", "error"); return; }
  DOM.modalScrim.classList.add("is-visible");
  DOM.fabAdd.classList.add("is-modal-open");
  document.body.style.overflow = "hidden";
  resetForm();
  setTimeout(() => DOM.inputName.focus(), 200);
}

function closeModal() {
  DOM.modalScrim.classList.remove("is-visible");
  DOM.fabAdd.classList.remove("is-modal-open");
  document.body.style.overflow = "";
  resetForm();
}

DOM.fabAdd.addEventListener("click", (e) => {
  const ripple = document.createElement("span");
  ripple.className = "fab__ripple";
  const rect = DOM.fabAdd.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (e.clientX - rect.left - size/2) + "px";
  ripple.style.top = (e.clientY - rect.top - size/2) + "px";
  DOM.fabAdd.appendChild(ripple);
  ripple.addEventListener("animationend", () => ripple.remove(), { once: true });
  openModal();
});

DOM.btnCancel.addEventListener("click", closeModal);
DOM.modalScrim.addEventListener("click", (e) => { if (e.target === DOM.modalScrim) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && DOM.modalScrim.classList.contains("is-visible")) closeModal(); });

DOM.addForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!State.isAdmin) { Toast.show("Login admin", "error"); return; }

  const name = DOM.inputName.value.trim();
  const desc = DOM.inputDesc.value.trim();
  const capital = DOM.inputCapital.value.trim();
  const language = DOM.inputLanguage.value.trim();
  const population = parseInt(DOM.inputPopulation.value.trim()) || 1000000;
  const area = parseFloat(DOM.inputArea.value.trim());
  const flag = DOM.inputFlagUrl.value.trim();

  let valid = true;
  if (!name) { showError("name", "Wajib diisi"); valid = false; } else clearError("name");
  if (!desc) { showError("desc", "Wajib diisi"); valid = false; } else clearError("desc");
  if (!capital) { showError("capital", "Wajib diisi"); valid = false; } else clearError("capital");
  if (!language) { showError("language", "Wajib diisi"); valid = false; } else clearError("language");
  if (isNaN(population) || population < 1) { showError("population", "Angka > 0"); valid = false; } else clearError("population");
  if (isNaN(area) || area < 1) { showError("area", "Angka > 0"); valid = false; } else clearError("area");
  if (flag && !flag.startsWith("http")) { showError("flag", "URL tidak valid"); valid = false; } else clearError("flag");
  if (!valid) return;

  DOM.btnSave.disabled = true;
  DOM.btnSave.classList.add("is-loading");

  try {
    await addDoc(countriesRef, {
      name, description: desc, capitalCity: capital, language,
      population: population,
      area, flag: flag || "",
      createdAt: serverTimestamp(),
      lastPopulationUpdate: serverTimestamp(),
      populationHistory: [{ from: population, to: population, percent: 0, time: new Date().toISOString() }]
    });
    Toast.show("Negara ditambahkan!", "success");
    closeModal();
  } catch (err) {
    Toast.show("Gagal menambah: " + err.message, "error");
    console.error(err);
  } finally {
    DOM.btnSave.disabled = false;
    DOM.btnSave.classList.remove("is-loading");
  }
});

// ===== LOGIN =====
DOM.btnLoginAdmin.addEventListener("click", () => {
  if (State.isAdmin) {
    if (confirm("Logout admin?")) {
      State.isAdmin = false;
      localStorage.removeItem("ufn_admin");
      updateAdminUI();
      Toast.show("Logout", "success");
    }
  } else {
    DOM.loginModalScrim.classList.add("is-visible");
  }
});

DOM.btnLoginCancel.addEventListener("click", () => DOM.loginModalScrim.classList.remove("is-visible"));
DOM.loginModalScrim.addEventListener("click", (e) => { if (e.target === DOM.loginModalScrim) DOM.loginModalScrim.classList.remove("is-visible"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && DOM.loginModalScrim.classList.contains("is-visible")) DOM.loginModalScrim.classList.remove("is-visible"); });

DOM.loginForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const pass = DOM.inputAdminPass.value;
  if (pass === ADMIN_PASSWORD) {
    State.isAdmin = true;
    localStorage.setItem("ufn_admin", "true");
    updateAdminUI();
    Toast.show("Login berhasil!", "success");
    DOM.loginModalScrim.classList.remove("is-visible");
    DOM.inputAdminPass.value = "";
    DOM.errorLogin.classList.remove("is-visible");
  } else {
    DOM.errorLogin.classList.add("is-visible");
    DOM.errorLogin.textContent = "Kode salah. Coba lagi.";
  }
});

// ===== TABS =====
DOM.tabs.forEach(tab => {
  tab.addEventListener("click", () => switchTab(tab.dataset.tab));
});

// ===== FIRESTORE SYNC =====
function startSync() {
  const q = query(countriesRef, orderBy("createdAt", "desc"));
  onSnapshot(q, (snap) => {
    State.allCountries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    State.isFirstLoad = false;
    if (State.currentTab === "list") renderList();
    else renderLeaderboard();
    updateAdminUI();
  }, (err) => {
    State.isFirstLoad = false;
    Toast.show("Gagal muat data: " + err.message, "error");
    console.error(err);
  });
}

// ===== CLICK OUTSIDE ACCORDION =====
DOM.countryList.addEventListener("click", (e) => {
  const head = e.target.closest(".country-card__head");
  if (head) {
    const card = head.closest(".country-card");
    if (card) toggleCard(card.dataset.id);
  }
});

// ===== INIT =====
updateAdminUI();
renderList();
startSync();

// Peringatan API Key
if (IMGBB_API_KEY === "YOUR_IMGBB_API_KEY") {
  console.warn("⚠️ Ganti IMGBB_API_KEY dengan API key Anda dari https://api.imgbb.com/");
  Toast.show("Ganti IMGBB_API_KEY di kode!", "error", 5000);
}
</script>
